openapi: 3.1.0
info:
  title: Qistas API
  version: "1"
  summary: Customers, contracts, instalments and payments for a lending or instalment business.
  description: |
    The API behind the Qistas web app and the Qistas mobile app. Everything an app needs: create an account or sign
    in, read what the plan allows, manage customers and contracts, take payments.

    **Conventions**

    * Base path `/api/v1`. Requests and responses are JSON. Send `Accept: application/json`.
    * Authentication is a bearer token: `Authorization: Bearer <token>`. A token is made by signing in (one per
      device, 30 days) or on purpose under *API access tokens* (for another program).
    * **Money is a string with two decimals** (`"1200.00"`), never a number. Dates are `YYYY-MM-DD`; moments are
      ISO 8601 in UTC (`2026-10-07T12:00:00Z`).
    * Send `Accept-Language` (`en`, `ar`, `fr`, `es`, `ur`) to receive messages and plan descriptions in that
      language. The reply carries `Content-Language`.
    * **Errors** always look the same: `{"error": {"code": "...", "message": "...", ...}}`. `code` is stable and for
      programs, `message` is translated and for people.
    * **Plans and limits.** Whether a feature is free or paid is decided by the plan the admin configured. Read it
      from `GET /me` (`entitlements`); never hard-code it. An action the plan does not allow answers **HTTP 402**
      with `code` `limit_reached` or `feature_locked`, the `feature`, the `limit`, how much is `used`, and an
      `upgrade_url`.
    * **Switched off by the platform.** Every feature in `entitlements` has a `status`: `on`, `plan_locked` (the plan
      does not include it: show it locked and offer an upgrade) or `platform_off` (the platform has it switched off
      or in a beta this workspace is not part of: show nothing, there is nothing to buy). `detail` says why when it
      is another feature that is the reason (`dependency:<key>`). A call to a feature that is `platform_off` answers
      **HTTP 403** with `code` `feature_unavailable` and no `upgrade_url`; when you receive it, read `GET /me` again
      and hide what is no longer `on`. `enabled` is `true` exactly when `status` is `on`.
    * **Retrying a payment.** `POST /contracts/{id}/payments` accepts an `Idempotency-Key` header (1 to 100 characters
      from `A-Z a-z 0-9 _ . : -`). Repeating a request with the same key and the same content records one payment and
      answers with it (200 instead of 201). The same key with different content is a `validation_failed`.
    * **Adding once.** Every other add (`POST /customers`, `/contracts`, `/products`, `/tags`, `/investors`,
      `/investors/{id}/entries`, `/contracts/{id}/guarantors`, `/contracts/{id}/amendments`, `/support/tickets`,
      `/team/invitations`, `/day-close`, and changes to customers) also takes an `Idempotency-Key` (16 to 100 of the same characters).
      A request repeated with the same key by the same person while the first is in flight, or within ten minutes of
      a success, is not run again: it answers with the first answer and the header `Idempotent-Replayed: true`. An
      answer that was not a success (a 422, a 402) lets the key go, so the corrected request can use it. A repeat that
      arrives while the first is still running after 15 seconds answers 409 (`http_409`): try again in a moment.
    * **Another workspace's records are never found**: they answer 404, not 403.
    * Lists are paginated: `?page=` and `?per_page=` (1 to 100, default 20); the reply has `data`, `links` and `meta`.
servers:
  - url: https://qistas-puce.vercel.app/api/v1
    description: Live
  - url: http://localhost:8080/api/v1
    description: docker compose on your computer
security:
  - bearer: []
tags:
  - name: Account
  - name: Plans
  - name: Customers
  - name: Contracts
  - name: Payments
  - name: Day close
  - name: Late fees
  - name: Paperwork
  - name: Import
  - name: Reports
  - name: Dashboard
  - name: API access tokens
  - name: Instalment tools
  - name: Team
  - name: Investors
  - name: Products
  - name: Documents
  - name: Backups
  - name: Help
paths:
  /plans:
    get:
      tags: [Plans]
      summary: The plans on offer, exactly as the admin set them up
      security: []
      parameters: [{$ref: "#/components/parameters/AcceptLanguage"}]
      responses:
        "200":
          description: The public plans, cheapest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: "#/components/schemas/Plan"}}
        "429": {$ref: "#/components/responses/RateLimited"}
  /appearance:
    get:
      tags: [Appearance]
      summary: The look chosen in the admin, for the app to wear
      description: |
        The full palette the server resolved from the colours the admin chose (26 tokens, light and dark: the app never
        derives colours itself), the logo, and the welcome banner meant for the Android app in the request's language
        (English when that language has no words of its own; `null` when there is none to show today). When an event
        theme is on for the asker's country (the signed-in workspace's, else the phone's language region), the look is
        the event's and `event` says until when; `base` then carries the usual look to go back to when the event ends,
        even offline. Public, but answered `private` (it depends on who asks). Send the `ETag` back as `If-None-Match`
        to get `304` when nothing changed.
      security: []
      parameters: [{$ref: "#/components/parameters/AcceptLanguage"}]
      responses:
        "200":
          description: The look.
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/Appearance"}
        "304": {description: The app already has this look.}
        "429": {$ref: "#/components/responses/RateLimited"}
  /demo:
    get:
      tags: [Account]
      summary: Whether "Try the demo" is on, and the two ways in
      description: |
        When the site offers it, the app shows two buttons. Each press of `POST /demo/{persona}` makes a throw-away
        account with its own workspace and sample data and signs in on this device. The account is nobody's real one,
        is never platform staff, and is deleted `hours` after it was made.
      security: []
      parameters: [{$ref: "#/components/parameters/AcceptLanguage"}]
      responses:
        "200":
          description: The offer. `personas` is empty when the demo is off.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      enabled: {type: boolean}
                      hours: {type: integer, description: How long a demo account lasts.}
                      personas:
                        type: array
                        items:
                          type: object
                          properties:
                            key: {type: string, enum: [admin, user]}
                            label: {type: string}
                            description: {type: string}
                            plan: {type: string, enum: [pro, free]}
        "429": {$ref: "#/components/responses/RateLimited"}
  /demo/{persona}:
    post:
      tags: [Account]
      summary: Enter the demo as an admin (Pro, every feature) or as a user (Free, with its limits)
      description: |
        A few demos an hour per address are allowed. `503 demo_busy` means the site already holds as many demo
        accounts as it allows; try again in a few minutes. `404` when the demo is off.
      security: []
      parameters:
        - {name: persona, in: path, required: true, schema: {type: string, enum: [admin, user]}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                device_name: {type: string, maxLength: 100}
      responses:
        "201":
          description: The throw-away account, its workspace, and a token for this device that lasts as long as the demo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/Session"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503":
          description: The demo is full (`demo_busy`).
  /auth/register:
    post:
      tags: [Account]
      summary: Open a free account and sign in on this device
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RegisterRequest"}
      responses:
        "201":
          description: The account, a workspace on the Free plan, and a token for this device.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/Session"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /auth/login:
    post:
      tags: [Account]
      summary: Sign in on this device
      description: |
        Wrong e-mail and wrong password are indistinguishable (`invalid_credentials`). An account with two-factor
        authentication answers `two_factor_required` (422) until a `code` from the authenticator app, or a
        `recovery_code`, is sent along. Five failed attempts per minute for one e-mail and address are allowed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginRequest"}
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/Session"}
        "401":
          description: "`invalid_credentials` or `invalid_two_factor_code`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: "`account_suspended`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422":
          description: "`validation_failed` or `two_factor_required`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /auth/logout:
    post:
      tags: [Account]
      summary: End this device's token
      responses:
        "204": {description: Signed out.}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /auth/logout-all:
    post:
      tags: [Account]
      summary: End every signed-in device of the person
      description: API access tokens made on purpose are not ended.
      responses:
        "204": {description: Every device is signed out.}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /me:
    get:
      tags: [Account]
      summary: Who is signed in, where, and what the plan allows right now
      parameters: [{$ref: "#/components/parameters/AcceptLanguage"}]
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/Account"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
    put:
      tags: [Account]
      summary: Change your own details (name, e-mail, phone, language)
      description: |
        A field that is not sent stays as it is; `phone` sent empty clears it. A new e-mail must be verified again (a link
        is sent to it and `email_verified` becomes false). Answers with the account, as GET /me does.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name: {type: string, maxLength: 255}
                email: {type: string, format: email}
                phone: {type: string, nullable: true, maxLength: 32, example: "+966501234567"}
                locale: {type: string, enum: [en, ar, fr, es, ur]}
      responses:
        "200":
          description: The account, changed.
          content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/Account"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /me/password:
    put:
      tags: [Account]
      summary: Change your password, with the current one
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: {type: string, format: password}
                password: {type: string, format: password, description: "At least 10 characters, with capital and small letters, a number and a symbol."}
                password_confirmation: {type: string, format: password}
      responses:
        "204": {description: Changed.}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /me/photo:
    post:
      tags: [Account]
      summary: Set your profile photo
      description: A JPEG, PNG or WebP picture up to 8 MB. It is drawn again without its hidden data and scaled to fit 400 × 400.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: {type: string, format: binary}
      responses:
        "200":
          description: The account, with `user.photo` set.
          content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/Account"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
    delete:
      tags: [Account]
      summary: Remove your profile photo
      responses:
        "200":
          description: The account, with `user.photo` null.
          content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/Account"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /billing:
    get:
      tags: [Account]
      summary: The workspace's plan, how it was paid, and what the app may sell (Win Plan PP13)
      description: |
        `store.available` is true only for the owner of a real workspace while Google Play billing is switched on and set
        up. The app offers subscriptions only then, buying with `store.account_ref` as the obfuscated account id, so the
        purchase can only ever be attached to this workspace. Paying by bank transfer is never offered in the app.
      responses:
        "200":
          description: Where the plan stands.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/BillingState"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /billing/play/verify:
    post:
      tags: [Account]
      summary: Attach a Google Play subscription purchase to the workspace
      description: |
        The server asks Google Play about the purchase token; nothing the phone says is trusted. On success the workspace
        is on the plan the product buys until the period Google reports, and the purchase is acknowledged. Safe to repeat
        (a restore on a new phone changes nothing). The owner alone buys.

        Errors: `purchase_invalid` (Google does not confirm it, or it is not a product on sale), `purchase_pending` (the
        payment is not complete yet), `purchase_inactive` (it lapsed), `purchase_elsewhere` (bought for, or already
        attached to, another workspace), `store_unavailable` (Google Play could not be asked; try again).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, purchase_token]
              properties:
                product_id: {type: string, maxLength: 100, example: qistas_pro}
                purchase_token: {type: string, maxLength: 2000}
      responses:
        "200":
          description: The purchase is attached; where the plan stands now.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/BillingState"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/FeatureUnavailable"}
        "409":
          description: "`purchase_elsewhere`: the purchase belongs to another workspace."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422":
          description: "`purchase_invalid`, `purchase_pending`, `purchase_inactive` or `validation_failed`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503":
          description: "`store_unavailable`: Google Play could not be asked. Nothing changed; try again."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /support:
    get:
      tags: [Help]
      summary: How to reach the Qistas team (Win Plan PP17)
      description: |
        `whatsapp` is the support number in international form (digits only, as wa.me wants it), or null until the
        platform sets one. `code` names the workspace in a message without revealing anything private; the app adds its
        version, and never a password.
      responses:
        "200":
          description: How to reach the team, and the reply promise.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      whatsapp: {type: [string, "null"], example: "966501234567"}
                      code: {type: string, example: Q-3F9A2C}
                      reply_hours: {type: integer, example: 24}
                      missing_data_hours: {type: integer, example: 4}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /support/tickets:
    get:
      tags: [Help]
      summary: The signed-in person's questions, with the team's replies, newest first
      responses:
        "200":
          description: Up to 50 tickets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/SupportTicket"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
    post:
      tags: [Help]
      summary: Send a question or report a problem
      description: Only the fields below are read; a password or a token sent along is never kept. Ten an hour.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, message]
              properties:
                category: {type: string, enum: [question, problem, missing_data, billing, idea]}
                message: {type: string, maxLength: 5000}
                app_version: {type: [string, "null"], example: 1.16.0}
                platform: {type: [string, "null"], enum: [android, ios, web, null]}
      responses:
        "201":
          description: Sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/SupportTicket"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /release-notes:
    get:
      tags: [Help]
      summary: What's new in the app versions after one (Win Plan PP17)
      description: Published notes only, newest first, in the reader's language or in English for a version not translated yet.
      parameters:
        - {name: since, in: query, required: false, schema: {type: string, example: 1.15.0}, description: "The version the app last showed notes for; only later ones are returned."}
      responses:
        "200":
          description: The notes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        version: {type: string, example: 1.16.0}
                        language: {type: string, example: ar}
                        body: {type: string}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /dashboard:
    get:
      tags: [Dashboard]
      summary: The headline figures and who pays today
      description: |
        `outstanding` is what is still owed on instalments of contracts that are not cancelled; `overdue` the part due
        before today; `collected_this_month` the net money received this calendar month; `active_customers` those with a
        running contract; `collection_rate` the percent of this month's instalments already paid (null when none fall
        due).
      responses:
        "200":
          description: The figures.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/Dashboard"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /glance:
    get:
      tags: [Dashboard]
      summary: Today's money in a glance, for the phone's home-screen widget
      description: |
        What the Android home-screen widget reads. Unlike other feature-gated endpoints it never answers 402 or 403: when the
        `home_widget` feature is not enabled for the workspace (the platform has it off, or the plan lacks it) it answers
        `200` with `{"data": {"enabled": false}}` and nothing else, so an installed widget shows "Open Qistas" instead of
        a failure.
        Otherwise `enabled` is true, and the counts and amounts are exactly those of the morning summary, on the
        workspace's own day: `due_count` and `due_amount` are the instalments due today or inside their grace days, and
        `late_count` and `late_amount` those past it. `next` is the first three of those due today (oldest first) and then
        those coming up in the next seven days; each shows what is still owed. A customer's `name` is included only with
        `names=1`; a phone number or national ID never is. Every successful read counts one use of the feature.
        Any role of the workspace may read it, a viewer included, and it covers the whole workspace. The server does not decide
        who sees names (anyone signed in can ask, and can already read them on the dashboard): the app asks for them only when
        the phone's own rules allow, and draws counts alone when the app lock is on.
      parameters:
        - {name: names, in: query, schema: {type: integer, enum: [0, 1], default: 0}, description: "1 to include each customer's name in `next`; left out otherwise."}
      responses:
        "200":
          description: "The snapshot, or only `enabled: false` when the feature is not enabled for the workspace."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - {$ref: "#/components/schemas/Glance"}
                      - {$ref: "#/components/schemas/GlanceOff"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /customers:
    get:
      tags: [Customers]
      summary: List customers, alphabetically
      parameters:
        - {name: sort, in: query, schema: {type: string, enum: [name, balance, next_due, activity], default: name}, description: "Pinned customers always come first; then by name, what they owe (most first), next due date (soonest first, nothing due last) or last activity (newest first)."}
        - {name: tag, in: query, schema: {type: string, format: uuid}, description: Only customers with this tag.}
        - {name: q, in: query, schema: {type: string}, description: Part of a name, phone number or e-mail.}
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/PerPage"}
      responses:
        "200":
          description: A page of customers with what each owes.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CustomerPage"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
    post:
      tags: [Customers]
      summary: Add a customer
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CustomerInput"}
      responses:
        "201":
          description: The customer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/Customer"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "402": {$ref: "#/components/responses/PlanLimit"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /customers/{customer}:
    parameters:
      - {name: customer, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Customers]
      summary: One customer with their contracts
      description: >-
        The only call that carries `pay_pattern`, and only while payday learning is on for the workspace (see the Customer
        schema).
      responses:
        "200":
          description: The customer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/Customer"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [Customers]
      summary: Change a customer
      description: |
        A national ID left out or blank keeps the stored one; send `remove_national_id: true` to erase it. `PATCH` is an
        alias.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CustomerInput"}
      responses:
        "200":
          description: The customer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/Customer"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
    delete:
      tags: [Customers]
      summary: Remove a customer from the lists
      description: Their contracts and payments stay in the books. A customer with a running contract cannot be removed (`validation_failed` on `customer`).
      responses:
        "204": {description: Removed. A place on the plan is free again.}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /contracts:
    get:
      tags: [Contracts]
      summary: List contracts, newest first
      parameters:
        - name: status
          in: query
          description: Which list. `late` is a running contract with an overdue instalment. An unknown value means `active`.
          schema: {type: string, enum: [active, late, settled, cancelled, all, archived], default: active}
        - {name: q, in: query, schema: {type: string}, description: "A reference (C-0012, 12) or part of the customer's name, phone or e-mail."}
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/PerPage"}
      responses:
        "200":
          description: A page of contracts.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ContractPage"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
    post:
      tags: [Contracts]
      summary: Open a contract
      description: |
        Creates the contract and its schedule (and the down payment line) in one step. Instalments add up to the total,
        to the cent. A cash sale (`type: cash`) needs only a customer and a price.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ContractInput"}
      responses:
        "201":
          description: The contract with its schedule.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/Contract"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "402": {$ref: "#/components/responses/PlanLimit"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /contracts/preview:
    post:
      tags: [Contracts]
      summary: See the schedule a plan would create, without storing anything
      description: The same engine that writes real contracts, so the preview is exact.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PreviewInput"}
      responses:
        "200":
          description: The schedule.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/Schedule"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /contracts/{contract}:
    parameters:
      - {name: contract, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Contracts]
      summary: One contract with its schedule and the money received
      responses:
        "200":
          description: The contract.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/Contract"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
  /contracts/{contract}/cancel:
    post:
      tags: [Contracts]
      summary: Cancel a running contract
      description: Owners and managers only. Nothing is deleted; the place on the plan is freed.
      parameters:
        - {name: contract, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string, maxLength: 500}
      responses:
        "200":
          description: The cancelled contract.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/Contract"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /contracts/{contract}/charges:
    post:
      tags: [Contracts]
      summary: "They took: add to an open contract's balance"
      description: >-
        A ledger line on an open contract (Win Plan PP4), never edited, voided through /payments/{transaction}/void like a
        payment. Past the credit limit it is still recorded and `meta.over_credit_limit` says so. Safe to retry with an
        `Idempotency-Key`. Needs the `open_contracts` feature (403 `feature_unavailable`); a contract that is not a running
        open one answers 422.
      parameters:
        - {name: contract, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: {$ref: "#/components/schemas/Money"}
                tag: {type: string, enum: [advance, refund, early_discount, unpaid]}
                note: {type: string, maxLength: 1000}
                charged_at: {type: string, description: "A date or a moment, never in the future. A moment with an offset or Z is that instant; one without an offset is read as UTC."}
                idempotency_key: {type: string}
      responses:
        "200":
          description: "A retry of a line already recorded: that line."
          content: {application/json: {schema: {$ref: "#/components/schemas/ChargeResult"}}}
        "201":
          description: The line, the balance now and whether it is past the credit limit.
          content: {application/json: {schema: {$ref: "#/components/schemas/ChargeResult"}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/FeatureUnavailable"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /contracts/{contract}/convert-to-open:
    post:
      tags: [Contracts]
      summary: Turn a scheduled or cash contract into an open one
      description: >-
        Owners and managers. Unpaid instalments are superseded (kept, no longer owed or late) and what was owed on them
        becomes the open contract's opening line. With `preview=1` nothing changes and the answer is exactly what would
        happen. Needs the `open_contracts` feature; a contract that is not running, or already open, answers 422.
      parameters:
        - {name: contract, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: preview, in: query, schema: {type: boolean}}
      responses:
        "200":
          description: The preview (`data` is the outcome) or the conversion (`data.conversion` and `data.contract`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - {$ref: "#/components/schemas/ConversionOutcome"}
                      - type: object
                        properties:
                          conversion: {$ref: "#/components/schemas/ConversionOutcome"}
                          contract: {$ref: "#/components/schemas/Contract"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /contracts/{contract}/payments/preview:
    post:
      tags: [Payments]
      summary: What a payment would cover, before it is taken
      description: >-
        Worked out by the allocator that records payments and never written: what is already due first (oldest
        instalment first), then the open late fees, then what is not due yet. The same amount recorded next covers
        exactly these. More than is owed (late fees included) answers 422, as recording would. On an open contract
        `covers` is empty and the amount comes off the balance.
      parameters:
        - {name: contract, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [amount], properties: {amount: {$ref: "#/components/schemas/Money"}}}
      responses:
        "200":
          description: The instalments it pays, what is left on the last one, and what is owed after.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      covers:
                        type: array
                        items:
                          type: object
                          properties:
                            number: {type: integer}
                            due_date: {type: string, format: date}
                            amount: {$ref: "#/components/schemas/Money"}
                            settles: {type: boolean, description: The instalment is paid in full.}
                      left_on_last: {type: [string, "null"], description: "What stays owed on the last instalment it touches."}
                      late_fees: {type: string, example: "10.00", description: "What goes to late fees (Win Plan K4)."}
                      owed_after: {$ref: "#/components/schemas/Money"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /contracts/{contract}/payments:
    post:
      tags: [Payments]
      summary: Record a payment
      description: |
        Applied to what is already due first (the oldest unpaid instalment first), then to open late fees, then to
        instalments not yet due; on an open contract it comes off the balance and may go past it (the customer then has
        credit). Safe to retry with an `Idempotency-Key`.
      parameters:
        - {name: contract, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PaymentInput"}
      responses:
        "200":
          description: "A retry of a payment already recorded: that payment."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/Transaction"}
        "201":
          description: The payment, and what the contract now owes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/Transaction"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /payments:
    get:
      tags: [Payments]
      summary: The money ledger, newest first
      parameters:
        - {name: contract_id, in: query, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/PerPage"}
      responses:
        "200":
          description: A page of ledger lines.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TransactionPage"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /payments/{transaction}/void:
    post:
      tags: [Payments]
      summary: Void a payment
      description: |
        Owners and managers only. Adds a reversal; the original line is never changed. Only instalment payments can be
        voided, once. What it paid on instalments and late fees is put back exactly (a fee waived since stays waived).
      parameters:
        - {name: transaction, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string, maxLength: 500}
      responses:
        "200":
          description: The reversal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/Transaction"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /day-close/today:
    get:
      tags: [Day close]
      summary: Today's cash to count, and today's close if there is one
      description: |
        What the end-of-day screen shows, on the workspace's own day. Behind the `day_close` feature (403
        `feature_unavailable` while the platform has it off, 402 `feature_locked` when the plan lacks it); anyone in the
        business may read it.

        `expected_cash` is the cash recorded today (cash payments, less cash given back by voids). `by_method`, `count`,
        `per_member` (each person's cash, keyed by user id), `non_cash` (every card, transfer, cheque and other line, each
        with its customer's name and note) and `watch` (what is worth a look: voided payments, waived fees, back-dated
        payments, contracts opened and cancelled) are the figures a close would keep. What an import brought in as paid
        before Qistas (lines tagged `imported`, and a void of one) is in none of them: it never went through a till.
        `closing_time` is the workspace's setting (`day_close.closing_time`, by its own clock). `per_member` names each
        person who took cash and how much, and every role that may read the day sees it (a collector and a viewer
        included).

        `close` is the day's latest close, when there is one: `closed` is true while it stands, and false once it has been
        reopened (the reopened close is still shown, with `status` `reopened`). `can_close` is true when the person may
        close the day (not a viewer) and it is not closed; `can_reopen` when it is closed and the person is an owner or a
        manager.
      responses:
        "200":
          description: Today.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/DayCloseToday"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "402": {$ref: "#/components/responses/PlanLimit"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /day-close:
    get:
      tags: [Day close]
      summary: Every close, newest day first
      description: |
        Within a day the latest version comes first, so a day that was reopened and closed again lists both. Anyone in the
        business may read it. Behind the `day_close` feature (403 `feature_unavailable` while the platform has it off, 402
        `feature_locked` when the plan lacks it).
      parameters:
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/PerPage"}
      responses:
        "200":
          description: A page of closes.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DayClosePage"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "402": {$ref: "#/components/responses/PlanLimit"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
    post:
      tags: [Day close]
      summary: Close a day
      description: |
        Sets the cash that was counted against what was recorded for the day, and keeps the day's figures as they were,
        signed with a hash. Anyone who records payments may close (not a viewer: 403). `day` is the workspace's own
        calendar day and is today when left out; it may be today or one of the seven days before it. A day is closed once:
        a second close (a double tap, a second phone) is a 422 on `day`, and a day that was reopened is closed again as the
        next version. Safe to retry with an `Idempotency-Key`: the retry answers with the first close.

        `counted_cash` is an amount with at most two decimals, written as text (`"3100.00"`); the server never reads it as
        a number. A mistake in it or in `day` is a 422 naming the field. Behind the `day_close` feature (403
        `feature_unavailable` while the platform has it off, 402 `feature_locked` when the plan lacks it; tell them apart from a
        viewer's 403 by `code`). When someone who is not an owner closes with a difference, the owners are told.
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DayCloseInput"}
      responses:
        "201":
          description: The close, with the sentence to share.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/DayClose"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "402": {$ref: "#/components/responses/PlanLimit"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /day-close/{close}/reopen:
    post:
      tags: [Day close]
      summary: Reopen a closed day
      description: |
        Owners and managers only (403 otherwise), with a reason of at least five characters. The close itself stays as it
        was signed: only its `status` moves to `reopened`, and who reopened it, when and why are written beside it. The day
        can then be closed again as the next version. Only a day's standing close can be reopened, once (422 on `day`).
        Another workspace's close is a 404. Behind the `day_close` feature (403 `feature_unavailable` while the platform has
        it off, 402 `feature_locked` when the plan lacks it).
      parameters:
        - {name: close, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 5, maxLength: 500}
      responses:
        "200":
          description: The close, now reopened.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/DayClose"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "402": {$ref: "#/components/responses/PlanLimit"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /day-close/{close}/summary.pdf:
    get:
      tags: [Day close]
      summary: The close as a signed PDF
      description: |
        The day, who closed it, the cash expected, counted and the difference, the money by way of paying and by person,
        and the card, transfer and other payments one by one: no customer's ID or phone. A reopened close says so. Like the
        other documents it counts one unit of the plan's PDF allowance, the same document again within ten minutes does
        not count twice, and its QR code opens `/verify/{code}`. Anyone in the business may have it, a viewer included (it holds
        each person's cash for the day). Behind the `day_close` feature (403 `feature_unavailable` while the platform has it
        off, 402 `feature_locked` when the plan lacks it; 402 `limit_reached` when the month's PDF allowance is used up).
      parameters:
        - {name: close, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/DocumentPaper"}
        - {$ref: "#/components/parameters/DocumentText"}
        - {$ref: "#/components/parameters/DocumentLanguage"}
      responses:
        "200":
          description: The PDF. `X-Document-Code` carries the code its QR code opens at `/verify/{code}`.
          headers:
            X-Document-Code: {schema: {type: string}, description: The verification code printed on the document.}
          content: {application/pdf: {schema: {type: string, format: binary}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "402": {$ref: "#/components/responses/PlanLimit"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /late-fees/{fee}/waive:
    post:
      tags: [Late fees]
      summary: Waive a late fee (Win Plan K4)
      description: |
        Owners and managers only, with a reason, which is kept and audited. What is still owed on the fee is forgiven;
        what was paid on it stays paid. Works whether the late_fees feature is on or off. A fee that is not open, or on
        a cancelled contract, answers 422 (`fee`). When the fee was the last thing owed, the contract is settled. Fees
        are charged by the nightly job and listed on their contract (`late_fees`).
      parameters:
        - {name: fee, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, maxLength: 500}
      responses:
        "200":
          description: The fee, waived.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/LateFee"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /contracts/{contract}/guarantors:
    post:
      tags: [Paperwork]
      summary: Add a guarantor to a contract (Win Plan K5)
      description: |
        At most three on a contract (a fourth answers 422 `guarantors`). Owners, managers and accountants; the
        guarantors feature must be on (403 `feature_unavailable` otherwise). Arabic and Urdu digits are read as plain
        ones. The ID number is kept encrypted and only ever returned masked. Guarantors are listed with their contract.
      parameters:
        - {name: contract, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GuarantorInput"}
      responses:
        "201":
          description: The guarantor.
          content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/Guarantor"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /guarantors/{guarantor}:
    put:
      tags: [Paperwork]
      summary: Change a guarantor
      description: |
        The whole guarantor each time. A null or empty `national_id` keeps the one stored; `remove_national_id: true`
        clears it. Owners, managers and accountants, with the feature on.
      parameters:
        - {name: guarantor, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: "#/components/schemas/GuarantorInput"}
                - {type: object, properties: {remove_national_id: {type: boolean}}}
      responses:
        "200":
          description: The guarantor.
          content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/Guarantor"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
    delete:
      tags: [Paperwork]
      summary: Remove a guarantor
      description: Owners and managers, whether the feature is on or off. Audited without who they were.
      parameters:
        - {name: guarantor, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Removed.}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /contracts/{contract}/photos:
    post:
      tags: [Paperwork]
      summary: Keep a photo with a contract (Win Plan K5)
      description: |
        The customer's ID (front or back), the signed paper contract or the invoice, as a JPEG or PNG of at most 6 MB.
        It is checked by what its bytes are, drawn again without location data, at most 1600 pixels on its longest
        side, and kept private. At most twelve on a contract (422 `file`). Owners, managers and accountants, with the
        guarantors feature on. Photos are listed with their contract.
      parameters:
        - {name: contract, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind: {type: string, enum: [id_front, id_back, contract_photo, invoice]}
                file: {type: string, format: binary}
      responses:
        "201":
          description: The photo.
          content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/ContractPhoto"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /contracts/{contract}/photos/{photo}:
    delete:
      tags: [Paperwork]
      summary: Remove a photo from a contract
      description: Owners and managers. The bytes leave storage; the record stays, marked deleted. A photo of another contract is 404.
      parameters:
        - {name: contract, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: photo, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Removed.}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /contracts/{contract}/signature:
    post:
      tags: [Paperwork]
      summary: The customer signs on this phone (Win Plan K5)
      description: |
        A PNG of the signature drawn on the screen (multipart `file`, at most 1 MB). It is drawn again by the server and
        kept with the contract; a new signature takes the place of the one before, which stays as history. Owners,
        managers and accountants, with the guarantors feature on. The latest signature is `signature` on the contract.
      parameters:
        - {name: contract, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {type: object, required: [file], properties: {file: {type: string, format: binary}}}
      responses:
        "201":
          description: The signature.
          content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/ContractSignature"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /contracts/{contract}/signature-links:
    post:
      tags: [Paperwork]
      summary: A link for the customer to sign on their own phone
      description: |
        The link works once, for 24 hours, and only with the six-digit `code`, which is to be sent apart (the link by
        WhatsApp, the code by text message), so a forwarded link alone signs nothing. Five wrong codes close it. The link
        and the code are in this answer only: just their hashes are kept. A new link closes the one before. Owners,
        managers and accountants, with the guarantors feature on.
      parameters:
        - {name: contract, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "201":
          description: The link and its code.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      url: {type: string, format: uri}
                      code: {type: string, example: "482913"}
                      expires_at: {type: string, format: date-time}
                      phone: {type: [string, "null"], description: The customer's phone, to send them both.}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /contracts/{contract}/agreement.pdf:
    get:
      tags: [Documents]
      summary: The contract as agreed (Win Plan K5)
      description: |
        The parties and the guarantors (ID numbers masked, and left out for collectors and viewers), what was sold, the
        price and the plan, the schedule and the customer's signature. Counts against the plan's documents like any other.
      parameters:
        - {name: contract, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/DocumentPaper"}
        - {$ref: "#/components/parameters/DocumentText"}
        - {$ref: "#/components/parameters/DocumentSections"}
        - {$ref: "#/components/parameters/DocumentCompact"}
        - {$ref: "#/components/parameters/DocumentLanguage"}
      responses:
        "200":
          description: The PDF. `X-Document-Code` carries the code its QR code opens at `/verify/{code}`.
          headers:
            X-Document-Code: {schema: {type: string}, description: The verification code printed on the document.}
          content: {application/pdf: {schema: {type: string, format: binary}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "402": {$ref: "#/components/responses/PlanLimit"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /contracts/{contract}/promissory-note.pdf:
    get:
      tags: [Documents]
      summary: A promissory note for what is still owed (Win Plan K5)
      description: |
        What is still owed on the instalments, in figures and in words, payable on the last instalment's due date, to the
        order of the shop, with the guarantors and the customer's signature. Behind the promissory_note feature (403
        `feature_unavailable`), which stays off until a lawyer approves the wording. Owners, managers and accountants.
      parameters:
        - {name: contract, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/DocumentPaper"}
        - {$ref: "#/components/parameters/DocumentText"}
        - {$ref: "#/components/parameters/DocumentSections"}
        - {$ref: "#/components/parameters/DocumentCompact"}
        - {$ref: "#/components/parameters/DocumentLanguage"}
      responses:
        "200":
          description: The PDF. `X-Document-Code` carries the code its QR code opens at `/verify/{code}`.
          headers:
            X-Document-Code: {schema: {type: string}, description: The verification code printed on the document.}
          content: {application/pdf: {schema: {type: string, format: binary}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "402": {$ref: "#/components/responses/PlanLimit"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /files/{file}:
    get:
      tags: [Paperwork]
      summary: A link to one stored file
      description: |
        A link that works for five minutes. ID photos are only for owners, managers and accountants (403 otherwise), and
        every opening of one is written to the audit log. This is how the app opens a `private` contract photo.
      parameters:
        - {name: file, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: The link.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      url: {type: string, format: uri}
                      expires_at: {type: string, format: date-time}
                      mime: {type: string, example: image/jpeg}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /imports:
    post:
      tags: [Import]
      summary: Read a file and make its trial run (Win Plan K9)
      description: |
        An Excel (.xlsx) or CSV file (comma, semicolon or tab), at most 10 MB, one customer per row under a header row.
        Columns are recognised in Arabic, English, French, Spanish and Urdu. Nothing is saved but the import itself:
        every row is planned and every problem is named by its row and column. A file may have at most the rows the
        plan allows at once (Free 100; 422 `file` otherwise). Owners and managers, with the import feature on.

        A notebook photo (JPEG or PNG) or a PDF report (at most 20 pages) is read by Claude into the same rows, once the
        Qistas team has saved the Anthropic key (422 `file` before that). Reading is counted in pages a month (Pro 50):
        402 `feature_locked` on a plan without it, 402 `limit_reached` when the pages left would not cover the file.
        Pages are counted only when the reading succeeds; a page that cannot be read is 422 `file`. Source `ai`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {type: object, required: [file], properties: {file: {type: string, format: binary}}}
      responses:
        "201":
          description: The trial run.
          content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/Import"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "402": {$ref: "#/components/responses/PlanLimit"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /imports/options:
    get:
      tags: [Import]
      summary: What this workspace may bring in
      description: |
        The rows a file may have at once (null: no limit), and whether photos and PDFs are read. `available`: the key is
        saved and the feature is not switched off for everyone, so the choice is shown; `included`: the plan has it (if
        not, show it as part of Pro); `pages_left`: pages that may still be read this month (null: no limit; 0 when not
        included).
      responses:
        "200":
          description: The options.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [rows_limit, ai]
                    properties:
                      rows_limit: {type: [integer, "null"], example: 100}
                      ai:
                        type: object
                        required: [available, included, pages_left]
                        properties:
                          available: {type: boolean}
                          included: {type: boolean}
                          pages_left: {type: [integer, "null"], example: 50}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /imports/template.xlsx:
    get:
      tags: [Import]
      summary: An empty sheet to fill in
      description: The column names an import recognises, in the language asked for (right to left for Arabic and Urdu). No example row.
      parameters:
        - {name: language, in: query, schema: {type: string, enum: [en, ar, fr, es, ur]}}
      responses:
        "200":
          description: The sheet.
          content: {application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {schema: {type: string, format: binary}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /imports/{import}:
    get:
      tags: [Import]
      summary: An import, as a trial run or as done
      parameters:
        - {name: import, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: The import.
          content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/Import"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [Import]
      summary: Choose the columns again
      description: |
        `mapping` names a column by its index and the field it is (or null to leave it out); columns not named keep what
        they were. A field goes to one column only. The trial run is made again. Not for an import already done (422).
      parameters:
        - {name: import, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mapping]
              properties:
                mapping:
                  type: object
                  additionalProperties: {type: [string, "null"], enum: [name, phone, national_id, address, item, total, paid, balance, installments, installment_amount, first_due, start_date, notes, null]}
      responses:
        "200":
          description: The trial run made again.
          content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/Import"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /imports/{import}/confirm:
    post:
      tags: [Import]
      summary: Bring the rows without a problem in
      description: |
        The trial run is made again against the books as they are now, and every row without a problem is brought in at
        once: new customers, or a contract added to a customer already on the books (same phone). A contract with a plan
        gets what was already paid as one payment dated today; a balance with no plan becomes an open contract's opening
        line. Confirming again changes nothing and answers with what was done.
      parameters:
        - {name: import, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: The import, done.
          content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/Import"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /reports/forecast:
    get:
      tags: [Reports]
      summary: Cash-flow forecast (Win Plan K8)
      description: |
        What still falls due on running contracts in the next 30, 60 and 90 days (each from today, after what is already
        paid), week by week for 13 weeks; apart from it what was due before today and is unpaid, and the open late fees.
        "Expected", never promised. Pro (402 feature_locked otherwise); everyone in the workspace but collectors.
      parameters:
        - {name: period, in: query, schema: {type: string, enum: [this_month, last_3_months, last_12_months, this_year, custom], default: last_12_months}, description: "Whole months; custom needs from and to."}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}, description: On or after from.}
        - {name: investor_id, in: query, schema: {type: string, format: uuid}, description: Only the contracts this investor funds.}
        - {name: product_id, in: query, schema: {type: string, format: uuid}, description: "Only the contracts that sold this product (and, for profit, only its share)."}
      responses:
        "200":
          description: The forecast.
          content:
            application/json:
              schema: {type: object, properties: {data: {$ref: "#/components/schemas/CashForecast"}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "402": {$ref: "#/components/responses/PlanLimit"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /reports/ageing:
    get:
      tags: [Reports]
      summary: Ageing (Win Plan RP15)
      description: |
        Every unpaid instalment of a running contract in one bucket by the days since its last day of grace: current,
        1–30, 31–60, 61–90, over 90. By bucket, and contract by contract, the latest first.
      parameters:
        - {name: period, in: query, schema: {type: string, enum: [this_month, last_3_months, last_12_months, this_year, custom], default: last_12_months}, description: "Whole months; custom needs from and to."}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}, description: On or after from.}
        - {name: investor_id, in: query, schema: {type: string, format: uuid}, description: Only the contracts this investor funds.}
        - {name: product_id, in: query, schema: {type: string, format: uuid}, description: "Only the contracts that sold this product (and, for profit, only its share)."}
      responses:
        "200":
          description: The buckets and the contracts.
          content:
            application/json:
              schema: {type: object, properties: {data: {$ref: "#/components/schemas/Ageing"}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "402": {$ref: "#/components/responses/PlanLimit"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /reports/profit:
    get:
      tags: [Reports]
      summary: Profit as money comes in (Win Plan K8, CT27)
      description: |
        Read from the investor ledger, so it follows its rule to the cent (a void takes back exactly what its payment
        gave). By month (the business's profit), by investor (what each kept, after a partner's commission) and by
        product (a contract's profit split by what each item sold for). With the collection rate of the period and the
        late fees collected, the business's apart from charity's.
      parameters:
        - {name: period, in: query, schema: {type: string, enum: [this_month, last_3_months, last_12_months, this_year, custom], default: last_12_months}, description: "Whole months; custom needs from and to."}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}, description: On or after from.}
        - {name: investor_id, in: query, schema: {type: string, format: uuid}, description: Only the contracts this investor funds.}
        - {name: product_id, in: query, schema: {type: string, format: uuid}, description: "Only the contracts that sold this product (and, for profit, only its share)."}
      responses:
        "200":
          description: The profit.
          content:
            application/json:
              schema: {type: object, properties: {data: {$ref: "#/components/schemas/ProfitReport"}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "402": {$ref: "#/components/responses/PlanLimit"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /settings/tools:
    get:
      tags: [Instalment tools]
      summary: The tools this workspace can configure
      description: |
        The settings of every feature that is `on` for the workspace, each with its kind (`switch`, `int`, `amount` or `select`),
        its current `value` and, for a select, its `options`. The list is empty until a feature declares a setting.
        Anyone in the workspace may read it; `meta.can_edit` says whether this person may change it (owner and manager).
        Draw the controls from this answer: a new tool needs no new screen.
      responses:
        "200":
          description: The tools.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: "#/components/schemas/Tool"}}
                  meta:
                    type: object
                    properties:
                      can_edit: {type: boolean}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /settings/tools/{key}:
    put:
      tags: [Instalment tools]
      summary: Change one tool
      description: |
        Owner and manager only (403 `forbidden` otherwise). The value must suit the tool's kind and rules (422
        `validation_failed`, field `value`). A tool whose feature the platform has switched off answers 403
        `feature_unavailable`; one the plan lacks answers 402 `feature_locked`. Every change is audited.
      parameters:
        - {name: key, in: path, required: true, schema: {type: string, example: reports.window_days}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: {description: "A boolean, a whole number or one of the tool's options, by its kind."}
      responses:
        "200":
          description: The tool as it now is.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/Tool"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "402": {$ref: "#/components/responses/PlanLimit"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /workspace/security:
    put:
      tags: [Instalment tools]
      summary: Set the business's phone security rule
      description: |
        Owner and manager only (403 `forbidden` otherwise). `require_app_lock` true means every phone must unlock
        Qistas with a fingerprint, a face or the phone's PIN before it shows the books; everyone reads it in
        `GET /me` (`tenant.require_app_lock`). Every change is audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [require_app_lock]
              properties:
                require_app_lock: {type: boolean}
      responses:
        "200":
          description: The rule as it now is.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      require_app_lock: {type: boolean}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /account/deletion:
    post:
      tags: [Account]
      summary: Delete my account
      description: |
        Asks for the password again (and `code` or `recovery_code` when two-step sign-in is on: 422
        `two_factor_required`, 401 `invalid_two_factor_code`). The **owner** deletes the business: they type its name in
        `confirm_name`; it turns read-only for everyone (writes answer 423 `workspace_deleting`) and is erased after 30
        days unless restored (202). **Anyone else** deletes only their own login, at once (200); the business is
        untouched. Rate-limited to a few tries a minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string}
                code: {type: string, description: From the authenticator app, when two-step sign-in is on.}
                recovery_code: {type: string}
                confirm_name: {type: string, description: The business name, exactly. Owner only.}
      responses:
        "200":
          description: A member's login was deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      scope: {type: string, enum: [login]}
        "202":
          description: The business will be erased after `restore_until` unless the owner restores it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      scope: {type: string, enum: [workspace]}
                      restore_until: {type: string, format: date}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "429": {$ref: "#/components/responses/RateLimited"}
    delete:
      tags: [Account]
      summary: Restore the business
      description: The owner changes their mind within the 30 days; everything is back exactly as it was. Anyone else gets 403.
      responses:
        "200":
          description: Restored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      restored: {type: boolean}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /investors:
    get:
      tags: [Investors]
      summary: Who funds the business, with each investor's figures
      description: >-
        The business's own capital (the main investor, made the first time it is asked for, which then takes on every
        contract made before investors existed) and its partners, archived ones last. Collectors may not look (403);
        owners, managers, accountants and viewers may. Readable even while the platform has the `investors` feature off.
      responses:
        "200":
          description: The investors.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      investors: {type: array, items: {$ref: "#/components/schemas/Investor"}}
                      can_manage: {type: boolean, description: Owner, manager or accountant (adds investors, records deposits and withdrawals).}
                      can_reverse: {type: boolean, description: Owner or manager (reverses a deposit or a withdrawal).}
                      limit: {type: integer, nullable: true, description: Investors the plan allows, the main one included (Free 1); null is unlimited.}
                      used: {type: integer}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [Investors]
      summary: Add a partner who funds contracts
      description: Owner, manager or accountant. The Free plan keeps the main investor only (402 `limit_reached`). An opening capital becomes the first deposit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, maxLength: 120}
                commercial_registration: {type: string, maxLength: 60}
                commission_percent: {type: string, example: "15", description: Share of this partner's profit that goes to the main investor (0 to 100).}
                notes: {type: string}
                opening_capital: {$ref: "#/components/schemas/Money"}
      responses:
        "201":
          description: The investor.
          content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/Investor"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "402": {$ref: "#/components/responses/PlanLimit"}
        "403": {$ref: "#/components/responses/FeatureUnavailable"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /investors/{investor}:
    parameters:
      - {name: investor, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Investors]
      summary: One investor's page
      description: The figures, profit in each of the last six months, the contracts they fund (newest 50) and their entries (newest 100).
      responses:
        "200":
          description: The investor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - {$ref: "#/components/schemas/Investor"}
                      - type: object
                        properties:
                          profit_by_month:
                            type: array
                            items: {type: object, properties: {month: {type: string, example: "2026-10"}, amount: {$ref: "#/components/schemas/Money"}}}
                          contracts:
                            type: array
                            items:
                              type: object
                              properties:
                                id: {type: string, format: uuid}
                                reference: {type: string}
                                customer: {type: object, nullable: true, properties: {id: {type: string, format: uuid}, name: {type: string}}}
                                status: {type: string, enum: [active, settled, cancelled]}
                                financed: {$ref: "#/components/schemas/Money"}
                                markup_amount: {$ref: "#/components/schemas/Money"}
                                collected: {$ref: "#/components/schemas/Money"}
                                start_date: {type: string, format: date}
                          entries: {type: array, items: {$ref: "#/components/schemas/InvestorEntry"}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [Investors]
      summary: Rename, change the registration, commission or notes, or archive
      description: An archived investor funds no new contracts and keeps everything it funded. The main investor is never archived and pays no commission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, maxLength: 120}
                commercial_registration: {type: string, nullable: true}
                commission_percent: {type: string, example: "15"}
                notes: {type: string, nullable: true}
                archived: {type: boolean}
      responses:
        "200":
          description: The investor.
          content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/Investor"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "402": {$ref: "#/components/responses/PlanLimit"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /investors/{investor}/entries:
    post:
      tags: [Investors]
      summary: Record money an investor put in or took out
      description: Owner, manager or accountant. The amount is positive; a withdrawal is stored negative. Entries are never edited.
      parameters:
        - {name: investor, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, amount]
              properties:
                type: {type: string, enum: [deposit, withdrawal]}
                amount: {$ref: "#/components/schemas/Money"}
                occurred_on: {type: string, format: date, description: Today when left out; never in the future.}
                note: {type: string, maxLength: 500}
      responses:
        "201":
          description: The entry.
          content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/InvestorEntry"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/FeatureUnavailable"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /investor-entries/{entry}/reverse:
    post:
      tags: [Investors]
      summary: Reverse a mistaken deposit or withdrawal
      description: Owner or manager. Writes the same amount negated, pointing back at it; an entry is reversed once. What a payment credited is reversed by voiding the payment (422 here).
      parameters:
        - {name: entry, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {note: {type: string, maxLength: 500}}}
      responses:
        "201":
          description: The reversal.
          content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/InvestorEntry"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /products:
    get:
      tags: [Products]
      summary: The products to pick from when opening a contract
      description: Archived ones with `archived=1`. No stock is counted.
      parameters:
        - {name: archived, in: query, schema: {type: boolean}}
      responses:
        "200":
          description: The products, by name.
          content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: "#/components/schemas/Product"}}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
    post:
      tags: [Products]
      summary: Add a product
      description: Anyone who writes. Needs the `contract_items` feature.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ProductInput"}}}
      responses:
        "201":
          description: The product.
          content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/Product"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/FeatureUnavailable"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /products/{product}:
    put:
      tags: [Products]
      summary: Change or archive a product
      parameters:
        - {name: product, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: "#/components/schemas/ProductInput"}
                - {type: object, properties: {archived: {type: boolean}}}
      responses:
        "200":
          description: The product.
          content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/Product"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /devices:
    get:
      tags: [Account]
      summary: The phones and browsers signed in to my account
      description: Each sign-in is its own token named after the device. API access tokens for other software are not listed. Needs a signed-in device (an "app" token).
      responses:
        "200":
          description: My sign-ins, most recently seen first; `current` is the one asking.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: integer}
                        name: {type: string}
                        current: {type: boolean}
                        last_used_at: {type: [string, "null"], format: date-time}
                        last_used_ip: {type: [string, "null"]}
                        signed_in_at: {type: string, format: date-time}
                        expires_at: {type: [string, "null"], format: date-time}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /devices/{device}:
    delete:
      tags: [Account]
      summary: Sign one of my devices out
      description: Revokes that sign-in only. Someone else's, or an API access token, is a 404.
      parameters:
        - {name: device, in: path, required: true, schema: {type: integer}}
      responses:
        "204": {description: Signed out.}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
  /team:
    get:
      tags: [Team]
      summary: The people in the business and the invitations waiting
      description: Anyone in the business may look. Behind the `members` feature (403 `feature_unavailable` while the platform has it off).
      responses:
        "200":
          description: The team.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      members: {type: array, items: {$ref: "#/components/schemas/TeamMember"}}
                      invitations: {type: array, items: {$ref: "#/components/schemas/Invitation"}}
                      can_manage: {type: boolean, description: Owner or manager.}
                      assignable_roles: {type: array, items: {type: string, enum: [manager, accountant, collector, viewer]}}
                      limit: {type: integer, nullable: true, description: People the plan allows (members plus invitations waiting); null is unlimited.}
                      used: {type: integer}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /team/invitations:
    post:
      tags: [Team]
      summary: Make an invitation link
      description: |
        Owner and manager only. The owner may give manager, accountant, collector or viewer; a manager only the last
        three (403 otherwise; `owner` is refused with 422). A waiting invitation holds a place under the plan's
        people limit (402 `limit_reached`, feature `members`). The link works once, for 7 days; only a fingerprint of
        its secret is kept, so `url` is shown only in this answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: {type: string, enum: [manager, accountant, collector, viewer]}
                name: {type: string, maxLength: 120}
                email: {type: string, format: email}
                phone: {type: string, maxLength: 32}
      responses:
        "201":
          description: The invitation and its link.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      invitation: {$ref: "#/components/schemas/Invitation"}
                      url: {type: string, format: uri}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "402": {$ref: "#/components/responses/PlanLimit"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /team/invitations/{invitation}:
    delete:
      tags: [Team]
      summary: Withdraw an invitation
      parameters:
        - {name: invitation, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Withdrawn; the link no longer works.}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /team/members/{member}:
    put:
      tags: [Team]
      summary: Change someone's role
      description: The owner's role never changes; a manager cannot change another manager. Every change is audited.
      parameters:
        - {name: member, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: {type: string, enum: [manager, accountant, collector, viewer]}
      responses:
        "200":
          description: The person with their new role.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/TeamMember"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
    delete:
      tags: [Team]
      summary: Remove someone from the business
      description: At once. If it was their only business they are signed out everywhere. The owner cannot be removed.
      parameters:
        - {name: member, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Removed.}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /invitations/accept:
    post:
      tags: [Team]
      summary: Join a business from an invitation link
      description: For someone already signed in. A used, withdrawn or expired link answers 410 `invitation_invalid`. The business joined becomes the one the account shows.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string, description: The last part of the invitation link.}
      responses:
        "200":
          description: The account, now in the business it joined.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/Account"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "410":
          description: The link is no longer valid (`invitation_invalid`).
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
  /tokens:
    get:
      tags: [API access tokens]
      summary: The API access tokens made on purpose
      description: Needs a signed-in device, not another API access token. A device's own sign-in is not listed.
      responses:
        "200":
          description: The tokens, without their secrets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: "#/components/schemas/Token"}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [API access tokens]
      summary: Make an API access token
      description: The secret is shown once, in this answer. How many a plan allows is the `api_tokens` feature (402 beyond it).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, maxLength: 100}
      responses:
        "201":
          description: The token, with its secret.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - {$ref: "#/components/schemas/Token"}
                      - type: object
                        properties:
                          token: {type: string}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "402": {$ref: "#/components/responses/PlanLimit"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /tokens/{token}:
    delete:
      tags: [API access tokens]
      summary: Revoke an API access token
      parameters:
        - {name: token, in: path, required: true, schema: {type: integer}}
      responses:
        "204": {description: Revoked. It stops working at once.}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /customers/{customer}/statement.pdf:
    get:
      tags: [Documents]
      summary: A customer's statement
      description: |
        Every contract of the customer with what is still owed and late today, then the account line by line with a
        running balance (a period with `from` and `to`; one contract with `contract`; the contracts one investor funds
        with `investor`, or that sold one product with `product`, named on the document). Counts once against the plan's
        monthly allowance of documents; the same document asked for again within ten minutes is not counted twice. The
        cost section is only ever shown to someone who sees the business's money.
      parameters:
        - {name: customer, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/DocumentPaper"}
        - {$ref: "#/components/parameters/DocumentText"}
        - {$ref: "#/components/parameters/DocumentSections"}
        - {$ref: "#/components/parameters/DocumentSummary"}
        - {$ref: "#/components/parameters/DocumentCompact"}
        - {$ref: "#/components/parameters/DocumentLanguage"}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: contract, in: query, schema: {type: string, format: uuid}}
        - {name: investor, in: query, schema: {type: string, format: uuid}, description: Only contracts this investor funds.}
        - {name: product, in: query, schema: {type: string, format: uuid}, description: Only contracts that sold this product.}
      responses:
        "200":
          description: The PDF. `X-Document-Code` carries the code its QR code opens at `/verify/{code}`.
          headers:
            X-Document-Code: {schema: {type: string}, description: The verification code printed on the document.}
          content: {application/pdf: {schema: {type: string, format: binary}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "402": {$ref: "#/components/responses/PlanLimit"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /contracts/{contract}/statement.pdf:
    get:
      tags: [Documents]
      summary: A contract's statement
      description: Its terms, what is still owed and late, the schedule with an overdue column, what was sold, and its account with a running balance.
      parameters:
        - {name: contract, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/DocumentPaper"}
        - {$ref: "#/components/parameters/DocumentText"}
        - {$ref: "#/components/parameters/DocumentSections"}
        - {$ref: "#/components/parameters/DocumentSummary"}
        - {$ref: "#/components/parameters/DocumentCompact"}
        - {$ref: "#/components/parameters/DocumentLanguage"}
      responses:
        "200":
          description: The PDF. `X-Document-Code` carries the code its QR code opens at `/verify/{code}`.
          headers:
            X-Document-Code: {schema: {type: string}, description: The verification code printed on the document.}
          content: {application/pdf: {schema: {type: string, format: binary}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "402": {$ref: "#/components/responses/PlanLimit"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /payments/{transaction}/receipt.pdf:
    get:
      tags: [Documents]
      summary: A receipt for a payment
      description: |
        Its number (the contract's number and which payment on it this is), the day and the time on the workspace's own
        clock, what it paid off and what is still owed after it. Only for money that came in (a void is 404). Prints on A4,
        A5 or a till roll (`80mm`, `58mm`), cut as long as it needs to be.
      parameters:
        - {name: transaction, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: paper, in: query, schema: {type: string, enum: [a4, a5, 80mm, 58mm]}}
        - {$ref: "#/components/parameters/DocumentText"}
        - {$ref: "#/components/parameters/DocumentSections"}
        - {$ref: "#/components/parameters/DocumentSummary"}
        - {$ref: "#/components/parameters/DocumentCompact"}
        - {$ref: "#/components/parameters/DocumentLanguage"}
      responses:
        "200":
          description: The PDF. `X-Document-Code` carries the code its QR code opens at `/verify/{code}`.
          headers:
            X-Document-Code: {schema: {type: string}, description: The verification code printed on the document.}
          content: {application/pdf: {schema: {type: string, format: binary}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "402": {$ref: "#/components/responses/PlanLimit"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /reports/transactions.pdf:
    get:
      tags: [Documents]
      summary: The money that came in over a period
      description: One line each, with the total for each way of paying (this month so far unless `from` and `to` are given). Narrowed by `investor` or `product`, the lines and totals follow and the document names the filter. Not for collectors (403).
      parameters:
        - {$ref: "#/components/parameters/DocumentPaper"}
        - {$ref: "#/components/parameters/DocumentText"}
        - {$ref: "#/components/parameters/DocumentSections"}
        - {$ref: "#/components/parameters/DocumentSummary"}
        - {$ref: "#/components/parameters/DocumentCompact"}
        - {$ref: "#/components/parameters/DocumentLanguage"}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: investor, in: query, schema: {type: string, format: uuid}, description: Only contracts this investor funds.}
        - {name: product, in: query, schema: {type: string, format: uuid}, description: Only contracts that sold this product.}
      responses:
        "200":
          description: The PDF. `X-Document-Code` carries the code its QR code opens at `/verify/{code}`.
          headers:
            X-Document-Code: {schema: {type: string}, description: The verification code printed on the document.}
          content: {application/pdf: {schema: {type: string, format: binary}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "402": {$ref: "#/components/responses/PlanLimit"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /investors/{investor}/report.pdf:
    get:
      tags: [Documents]
      summary: An investor's report
      description: Their figures, the contracts they fund with what is owed and late on each, and the wallet line by line with a running balance.
      parameters:
        - {name: investor, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/DocumentPaper"}
        - {$ref: "#/components/parameters/DocumentText"}
        - {$ref: "#/components/parameters/DocumentSections"}
        - {$ref: "#/components/parameters/DocumentSummary"}
        - {$ref: "#/components/parameters/DocumentCompact"}
        - {$ref: "#/components/parameters/DocumentLanguage"}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
      responses:
        "200":
          description: The PDF. `X-Document-Code` carries the code its QR code opens at `/verify/{code}`.
          headers:
            X-Document-Code: {schema: {type: string}, description: The verification code printed on the document.}
          content: {application/pdf: {schema: {type: string, format: binary}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "402": {$ref: "#/components/responses/PlanLimit"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /settings/business-profile:
    get:
      tags: [Documents]
      summary: Who the documents come from
      responses:
        "200":
          description: The business profile, with its logo and signature as data URIs.
          content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/BusinessProfile"}, meta: {type: object, properties: {can_edit: {type: boolean}}}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
    put:
      tags: [Documents]
      summary: Change the business profile
      description: Owners and managers. A field left out keeps its value; one sent empty is cleared.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/BusinessProfileInput"}}}
      responses:
        "200":
          description: The business profile.
          content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/BusinessProfile"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /settings/business-profile/{slot}:
    parameters:
      - {name: slot, in: path, required: true, schema: {type: string, enum: [logo, signature]}}
    post:
      tags: [Documents]
      summary: A new logo or signature
      description: Owners and managers. PNG or JPEG for a logo, PNG for a signature, up to 2 MB; it is redrawn without hidden data and scaled down.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {type: object, required: [file], properties: {file: {type: string, format: binary}}}
      responses:
        "200":
          description: The business profile.
          content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/BusinessProfile"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
    delete:
      tags: [Documents]
      summary: Remove the logo or the signature
      responses:
        "200":
          description: The business profile.
          content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/BusinessProfile"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /settings/documents:
    get:
      tags: [Documents]
      summary: How documents look by default
      responses:
        "200":
          description: The workspace's document choices.
          content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/DocumentPreferences"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
    put:
      tags: [Documents]
      summary: Change how documents look by default
      description: Owners and managers. What is not sent stays as it was; a word sent empty goes back to the usual one.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/DocumentPreferences"}}}
      responses:
        "200":
          description: The workspace's document choices.
          content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/DocumentPreferences"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /backups:
    get:
      tags: [Backups]
      summary: When the books were last copied, and the copies kept
      description: Owners, managers and accountants, on any plan. Every business gets a copy every night; the newest seven are kept, encrypted. Downloads asked for are listed for a day.
      responses:
        "200":
          description: The last nightly copy's time and the copies.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      last_backup_at: {type: string, format: date-time, nullable: true}
                      copies: {type: array, items: {$ref: "#/components/schemas/WorkspaceExport"}}
                  meta: {type: object, properties: {can_export: {type: boolean}, kept: {type: integer}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /exports:
    post:
      tags: [Backups]
      summary: Everything in one file
      description: |
        Customers, contracts, instalments, payments, what was sold, investors and their entries, one sheet each: an Excel
        file, or CSV files (each with a UTF-8 byte-order mark) in a zip. Works on every plan, including a lapsed one, and
        while the business is being deleted. Answered 202; the file is usually ready at once (`status: ready`); a client
        told `pending` asks `GET /exports/{export}` again. Owners, managers and accountants.
      requestBody:
        content: {application/json: {schema: {type: object, properties: {format: {type: string, enum: [xlsx, csv], default: xlsx}}}}}
      responses:
        "202":
          description: The export.
          content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/WorkspaceExport"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /exports/{export}:
    parameters:
      - {name: export, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Backups]
      summary: One export, to see whether it is ready
      responses:
        "200":
          description: The export.
          content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/WorkspaceExport"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /exports/{export}/download:
    parameters:
      - {name: export, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Backups]
      summary: A link to the file that works for five minutes
      description: The link needs no sign-in (its signature is the permission), so the app can download it directly.
      responses:
        "200":
          description: The link.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      url: {type: string, format: uri}
                      expires_at: {type: string, format: date-time}
                      filename: {type: string}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /activity:
    get:
      tags: [Backups]
      summary: The activity log
      description: |
        What the business's people did, newest first, as a line in the asker's language: customers added, changed and
        removed (which fields, never their values), contracts opened and cancelled, payments recorded and voided, investors,
        products, the team and settings. Owners and managers.
      parameters:
        - {name: user, in: query, schema: {type: string, format: uuid}}
        - {name: kind, in: query, schema: {type: string, enum: [customers, contracts, payments, investors, products, team, settings]}}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: A page of entries, and the people to filter by.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: "#/components/schemas/ActivityEntry"}}
                  meta:
                    type: object
                    properties:
                      current_page: {type: integer}
                      last_page: {type: integer}
                      total: {type: integer}
                      people: {type: array, items: {type: object, properties: {id: {type: string, format: uuid}, name: {type: string}}}}
                      kinds: {type: array, items: {type: string}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /customers/{customer}/pin:
    parameters:
      - {name: customer, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Customers]
      summary: Pin a customer to the top of every list
      responses:
        "200":
          description: The customer.
          content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/Customer"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [Customers]
      summary: Unpin a customer
      responses:
        "200":
          description: The customer.
          content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/Customer"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /tags:
    get:
      tags: [Customers]
      summary: The business's tags, with how many customers have each
      responses:
        "200":
          description: The tags, by name.
          content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: "#/components/schemas/Tag"}}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
    post:
      tags: [Customers]
      summary: Add a tag
      description: Anyone who writes. Needs the `customer_tags` feature. A name is unique in the business whatever its case.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/TagInput"}}}
      responses:
        "201":
          description: The tag.
          content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/Tag"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/FeatureUnavailable"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /tags/{tag}:
    parameters:
      - {name: tag, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      tags: [Customers]
      summary: Rename or recolour a tag
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/TagInput"}}}
      responses:
        "200":
          description: The tag.
          content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/Tag"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/FeatureUnavailable"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
    delete:
      tags: [Customers]
      summary: Let go of a tag; its customers are unchanged
      responses:
        "204": {description: Removed.}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/FeatureUnavailable"}
        "404": {$ref: "#/components/responses/NotFound"}
  /contracts/{contract}/archive:
    parameters:
      - {name: contract, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Contracts]
      summary: Put a settled or cancelled contract away
      description: It leaves the lists (it shows under `status=archived`) and changes nothing else; investors still count it. A running contract is refused with `contract_running`.
      responses:
        "200":
          description: The contract.
          content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/Contract"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /contracts/{contract}/unarchive:
    parameters:
      - {name: contract, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Contracts]
      summary: Bring an archived contract back to the lists
      responses:
        "200":
          description: The contract.
          content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/Contract"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /reminders/due-today:
    get:
      tags: [Reminders]
      summary: Remind everyone — who pays today (or who is late), each with the message ready for WhatsApp
      description: Needs the `instalment_alerts` feature. `scope=due` lists exactly the dashboard's due-today rows (more of them); `scope=late` the late ones, oldest first. The message uses the business's own wording in the language asked for, or the default wording in it.
      parameters:
        - {name: scope, in: query, schema: {type: string, enum: [due, late], default: due}}
        - {name: language, in: query, schema: {type: string, enum: [en, ar, fr, es, ur]}, description: Defaults to the request's language.}
      responses:
        "200":
          description: The checklist.
          content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: "#/components/schemas/DueReminder"}}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/FeatureUnavailable"}
  /message-templates:
    get:
      tags: [Reminders]
      summary: The reminder wording in every language, each with its default and whether the business wrote its own
      responses:
        "200":
          description: Two keys (reminder_due, reminder_late) in five languages.
          content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: "#/components/schemas/MessageTemplate"}}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /message-templates/{key}:
    parameters:
      - {name: key, in: path, required: true, schema: {type: string, enum: [reminder_due, reminder_late]}}
    put:
      tags: [Reminders]
      summary: Write the business's own wording in one language (empty brings the default back)
      description: Owners and managers. Placeholders :name, :amount, :date, :reference and :business are filled in when a message is written.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language, body]
              properties:
                language: {type: string, enum: [en, ar, fr, es, ur]}
                body: {type: string, nullable: true, maxLength: 1000}
      responses:
        "200":
          description: The wording now in use.
          content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/MessageTemplate"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /push-tokens:
    post:
      tags: [Notifications]
      summary: Register this phone for pushes (Firebase token)
      description: App tokens only. The same token again only refreshes it (200); a token registered by someone else moves to whoever signed in on the phone last.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token: {type: string, maxLength: 512}
                platform: {type: string, enum: [android, ios, web]}
                app_version: {type: string, nullable: true, maxLength: 32}
      responses:
        "201": {description: Registered.}
        "200": {description: Already registered; refreshed.}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /push-tokens/{token}:
    parameters:
      - {name: token, in: path, required: true, schema: {type: string}}
    delete:
      tags: [Notifications]
      summary: Stop pushes to this phone (on signing out)
      responses:
        "204": {description: Stopped.}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
  /notifications:
    get:
      tags: [Notifications]
      summary: My inbox, newest first
      responses:
        "200":
          description: A page of alerts, with how many are unread.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: "#/components/schemas/AppNotification"}}
                  meta: {type: object, properties: {current_page: {type: integer}, last_page: {type: integer}, total: {type: integer}, unread: {type: integer}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /notifications/read:
    post:
      tags: [Notifications]
      summary: Mark alerts read (all of them when no ids are sent)
      requestBody:
        content: {application/json: {schema: {type: object, properties: {ids: {type: array, maxItems: 100, items: {type: string, format: uuid}}}}}}
      responses:
        "200":
          description: How many are still unread.
          content: {application/json: {schema: {type: object, properties: {data: {type: object, properties: {unread: {type: integer}}}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /notifications/preferences:
    get:
      tags: [Notifications]
      summary: My notice choices in this workspace
      description: |
        Every kind of notice, on or off, with its channels (in the app, by e-mail, by text message). A notice goes out on a
        channel only when the person chose it, the admin allows that kind on it (`meta.allowed`) and it is set up
        (`meta.channels`; e-mail also needs a verified address). Billing kinds reach the workspace's owners.
      responses:
        "200":
          description: Every kind, with its default where never changed, and what can be chosen.
          content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/NotificationPreferences"}, meta: {$ref: "#/components/schemas/NotificationChoices"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
    put:
      tags: [Notifications]
      summary: Change some of my notice choices
      description: Send only what changes; a kind's channels are merged one by one, so naming one never forgets the others.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/NotificationPreferences"}}}
      responses:
        "200":
          description: Every kind after the change.
          content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/NotificationPreferences"}, meta: {$ref: "#/components/schemas/NotificationChoices"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /contracts/{contract}/early-settlement:
    parameters:
      - {name: contract, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Contracts]
      summary: What settling early costs today
      description: Needs the `early_settlement` feature. Profit counts as money comes in (paid x markup / total); the rebate is a percent of the profit not yet earned, or an amount, never more than that profit, rounded half up. Nothing is written.
      parameters:
        - {name: rebate_type, in: query, schema: {type: string, enum: [none, percent, fixed], default: none}}
        - {name: rebate_value, in: query, schema: {type: string, example: "50"}}
      responses:
        "200":
          description: The quote.
          content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/EarlySettlementQuote"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/FeatureUnavailable"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
    post:
      tags: [Contracts]
      summary: Settle early at the payoff shown
      description: |
        Owners and managers. Takes the payoff (one payment tagged early_discount, applied oldest first), waives what the
        rebate covers, writes one adjustment and settles the contract. If money came in since the quote, the payoff has
        changed: 409 `quote_changed` with the new quote, and nothing is written. Safe to retry with an `Idempotency-Key`.
        Voiding the payment brings the contract, the waived instalments and the rebate back.
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payoff, method]
              properties:
                rebate_type: {type: string, enum: [none, percent, fixed]}
                rebate_value: {type: string}
                payoff: {$ref: "#/components/schemas/Money"}
                method: {type: string, enum: [cash, bank_transfer, card, cheque, other]}
                paid_at: {type: string}
                note: {type: string, maxLength: 500}
      responses:
        "201":
          description: The settled contract.
          content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/Contract"}}}}}
        "200": {description: "A retry: the contract as the first attempt left it."}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: The payoff has changed since it was shown.
          content: {application/json: {schema: {type: object, properties: {error: {$ref: "#/components/schemas/Error"}, data: {$ref: "#/components/schemas/EarlySettlementQuote"}}}}}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /contracts/{contract}/amendments/preview:
    parameters:
      - {name: contract, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Contracts]
      summary: What a change to the plan would do, writing nothing
      description: Needs the `reschedule` feature; anyone who writes. Only instalments nobody has paid towards change.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/AmendmentInput"}}}
      responses:
        "200":
          description: The old and the new schedule.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      old_schedule: {type: array, items: {$ref: "#/components/schemas/ScheduleRow"}}
                      new_schedule: {type: array, items: {$ref: "#/components/schemas/ScheduleRow"}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/FeatureUnavailable"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /contracts/{contract}/amendments:
    parameters:
      - {name: contract, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Contracts]
      summary: Change the plan, with the reason
      description: Owners and managers. The untouched instalments are superseded (kept as history) and new ones written after the last number; paid ones never move, and the agreed total never changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: "#/components/schemas/AmendmentInput"}
                - {type: object, required: [reason], properties: {reason: {type: string, maxLength: 500}}}
      responses:
        "201":
          description: The change and the contract after it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      amendment: {$ref: "#/components/schemas/ContractAmendment"}
                      contract: {$ref: "#/components/schemas/Contract"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /customers/{customer}/payments:
    parameters:
      - {name: customer, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Payments]
      summary: One payment across a customer's contracts
      description: Needs the `payment_targeting` feature. The oldest instalment due first across the customer's running contracts with a schedule, or a split chosen by hand. One ledger line on each contract, tied together as a batch. All or nothing; safe to retry with an `Idempotency-Key`.
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, method]
              properties:
                amount: {$ref: "#/components/schemas/Money"}
                method: {type: string, enum: [cash, bank_transfer, card, cheque, other]}
                paid_at: {type: string}
                note: {type: string, maxLength: 1000}
                split:
                  type: array
                  items: {type: object, required: [contract_id, amount], properties: {contract_id: {type: string, format: uuid}, amount: {$ref: "#/components/schemas/Money"}}}
      responses:
        "201":
          description: The batch and its payments.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: {type: string, format: uuid}
                      amount: {type: string}
                      method: {type: string}
                      payments: {type: array, items: {$ref: "#/components/schemas/Transaction"}}
        "200": {description: "A retry: the batch already recorded."}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/FeatureUnavailable"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    Page: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
    PerPage: {name: per_page, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    AcceptLanguage:
      name: Accept-Language
      in: header
      schema: {type: string, example: ar}
      description: One of en, ar, fr, es, ur.
    DocumentPaper: {name: paper, in: query, schema: {type: string, enum: [a4, a5]}, description: The workspace's preference when left out.}
    DocumentText: {name: text, in: query, schema: {type: string, enum: [small, normal, large]}}
    DocumentSections:
      name: sections
      in: query
      style: deepObject
      explode: true
      description: Turn sections on or off for this document, e.g. `sections[cost]=1&sections[schedule]=0`.
      schema: {type: object, properties: {cost: {type: boolean}, overdue: {type: boolean}, schedule: {type: boolean}, signature: {type: boolean}}}
    DocumentSummary: {name: summary, in: query, schema: {type: boolean}, description: A one-page summary without the line-by-line account.}
    DocumentCompact: {name: compact, in: query, schema: {type: boolean}, description: A smaller header.}
    DocumentLanguage: {name: language, in: query, schema: {type: string, enum: [en, ar, fr, es, ur]}, description: The asker's language when left out.}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: {type: string, pattern: '^[A-Za-z0-9_.:\-]{1,100}$'}
      description: Makes a retry record one payment.
  responses:
    Unauthenticated:
      description: No token, an unknown token, or an expired one (`unauthenticated`).
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Forbidden:
      description: The role may not do that, the token lacks the ability, or the account is suspended (`forbidden`, `account_suspended`).
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    NotFound:
      description: It does not exist, or belongs to another workspace (`not_found`).
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    ValidationFailed:
      description: Something sent is not valid (`validation_failed`); `fields` says which and why.
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    PlanLimit:
      description: The plan does not allow it (`limit_reached` or `feature_locked`).
      content: {application/json: {schema: {$ref: "#/components/schemas/PlanError"}}}
    FeatureUnavailable:
      description: The platform has the feature switched off for this workspace (`feature_unavailable`). There is no upgrade to offer.
      content: {application/json: {schema: {$ref: "#/components/schemas/FeatureError"}}}
    RateLimited:
      description: Too many requests (`rate_limited`); wait `Retry-After` seconds.
      headers: {Retry-After: {schema: {type: integer}}}
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
  schemas:
    Money: {type: string, pattern: '^-?\d+\.\d{2}$', example: "1200.00"}
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, example: validation_failed}
            message: {type: string}
            fields: {type: object, additionalProperties: {type: array, items: {type: string}}}
            retry_after: {type: integer}
    PlanError:
      type: object
      properties:
        error:
          type: object
          required: [code, message, feature, limit, used, upgrade_url]
          properties:
            code: {type: string, enum: [limit_reached, feature_locked]}
            message: {type: string}
            feature: {type: string, example: customers}
            limit: {type: [integer, "null"]}
            used: {type: [integer, "null"]}
            upgrade_url: {type: string, format: uri}
    Tool:
      type: object
      properties:
        key: {type: string, example: reports.window_days}
        feature: {type: string, example: advanced_reports}
        type: {type: string, enum: [switch, int, select, amount]}
        label: {type: string}
        help: {type: string}
        value: {description: "A boolean, a whole number, an amount (a string with two decimals; Arabic and Urdu digits are read) or the chosen option's value."}
        options:
          type: array
          description: Only for a select.
          items:
            type: object
            properties:
              value: {type: string}
              label: {type: string}
    FeatureError:
      type: object
      properties:
        error:
          type: object
          required: [code, message, feature]
          properties:
            code: {type: string, enum: [feature_unavailable]}
            message: {type: string}
            feature: {type: string, example: advanced_reports}
    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation, business_name, country, terms]
      properties:
        name: {type: string}
        email: {type: string, format: email}
        password: {type: string, minLength: 10, description: "At least 10 characters with upper and lower case, a number and a symbol; known-breached passwords are refused."}
        password_confirmation: {type: string}
        business_name: {type: string}
        country: {type: string, minLength: 2, maxLength: 2, example: SA, description: "ISO 3166-1 alpha-2; decides the starting currency."}
        terms: {type: boolean, const: true}
        locale: {type: string, enum: [en, ar, fr, es, ur]}
        device_name: {type: string, maxLength: 100, example: Pixel 9}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string}
        password: {type: string}
        device_name: {type: string, maxLength: 100}
        code: {type: string, description: The 6-digit code from the authenticator app.}
        recovery_code: {type: string}
    Session:
      type: object
      properties:
        token: {type: string, description: "Shown once. Send as Authorization: Bearer <token>."}
        token_type: {type: string, const: Bearer}
        expires_at: {type: string, format: date-time}
        user: {$ref: "#/components/schemas/User"}
        tenant: {$ref: "#/components/schemas/Tenant"}
        plan: {$ref: "#/components/schemas/PlanRef"}
        entitlements: {$ref: "#/components/schemas/Entitlements"}
    BillingState:
      type: object
      description: Where a workspace's plan stands and how it can buy one (Win Plan PP13).
      properties:
        plan:
          type: object
          properties:
            key: {type: string, example: pro}
            name: {type: string, example: Pro}
        status:
          type: [string, "null"]
          enum: [active, trialing, past_due, null]
          description: Null on the free plan.
        until: {type: [string, "null"], format: date, description: "The last day of the period paid; null when it does not lapse or on the free plan."}
        source: {type: [string, "null"], enum: [play, appstore, web, manual, stripe, admin, null], description: "How the plan was paid: Google Play, the App Store, the website, a bank transfer, a card subscription taken on the website (stripe), or given by the Qistas team. The app shows a plan paid outside the store as it stands and never names or offers that way to pay."}
        auto_renew: {type: [boolean, "null"]}
        period: {type: [string, "null"], enum: [month, year, null], description: "How often the plan is paid for; null on the free plan, for a plan the team gave, or when the store does not say."}
        can_buy: {type: boolean, description: "The owner of a real workspace (not a demo or test one)."}
        store:
          type: object
          properties:
            available: {type: boolean}
            account_ref: {type: [string, "null"], description: "Pass as the obfuscated account id when buying."}
            products:
              type: array
              items:
                type: object
                properties:
                  plan_key: {type: string, example: pro}
                  product_id: {type: string, example: qistas_pro}
    SupportTicket:
      type: object
      description: A question or problem sent from the app, with the team's replies (Win Plan PP17).
      properties:
        id: {type: string, format: uuid}
        category: {type: string, enum: [question, problem, missing_data, billing, idea]}
        message: {type: string}
        status: {type: string, enum: [open, answered, closed]}
        app_version: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
        first_reply_at: {type: [string, "null"], format: date-time}
        replies:
          type: array
          items:
            type: object
            properties:
              body: {type: string}
              created_at: {type: string, format: date-time}
    Account:
      type: object
      properties:
        user: {$ref: "#/components/schemas/User"}
        tenant: {$ref: "#/components/schemas/Tenant"}
        plan: {$ref: "#/components/schemas/PlanRef"}
        entitlements: {$ref: "#/components/schemas/Entitlements"}
    User:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        email: {type: string}
        email_verified: {type: boolean}
        phone: {type: string, nullable: true, description: The person's own phone, set on their profile.}
        photo: {type: string, nullable: true, description: "The profile photo as a data URI (data:image/jpeg;base64,...), or null."}
        member_since: {type: string, format: date, nullable: true}
        locale: {type: string}
        two_factor: {type: boolean, description: "Whether signing in needs a code from this person. Always false for the admin team."}
        two_factor_available: {type: boolean, description: "False for the admin team, who never use two-factor; the app shows no setting for it. Business owners get true."}
    Tenant:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        country: {type: string}
        currency: {type: string, example: SAR}
        role: {type: string, enum: [owner, manager, accountant, collector, viewer]}
        is_test:
          type: boolean
          description: True for a platform admin's test workspace (sample data). Show it as a test, never as a customer's books.
        is_demo:
          type: boolean
          description: True for a throw-away workspace made by "Try the demo". Say so, and offer a real account.
        hijri_dates:
          type: string
          enum: [off, beside, first]
          description: "How the workspace shows dates (Win Plan CT26): Gregorian only, the Umm al-Qura day beside it, or first. Always off while the hijri_dates feature is off. Dates sent and received stay Gregorian (YYYY-MM-DD)."
        require_app_lock:
          type: boolean
          description: The business requires every phone to unlock Qistas (fingerprint, face or the phone's PIN) before showing its books. The app turns its lock on and does not let it be turned off.
        deletion_scheduled_for:
          type: string
          format: date
          nullable: true
          description: The owner asked to delete the business. It is read-only (writes answer 423 `workspace_deleting`) and is erased after this day unless the owner restores it.
    Product:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        sku: {type: [string, "null"]}
        default_price: {type: [string, "null"]}
        cost: {type: [string, "null"]}
        archived: {type: boolean}
    ProductInput:
      type: object
      required: [name]
      properties:
        name: {type: string, maxLength: 120}
        sku: {type: string, maxLength: 60}
        default_price: {$ref: "#/components/schemas/Money"}
        cost: {$ref: "#/components/schemas/Money"}
    DueReminder:
      type: object
      properties:
        installment_id: {type: string, format: uuid}
        contract_id: {type: string, format: uuid}
        contract_reference: {type: string}
        customer_id: {type: string, format: uuid}
        customer_name: {type: string}
        customer_phone: {type: string}
        amount_due: {type: string, example: "100.00"}
        due_date: {type: string, format: date}
        days_late: {type: integer, description: Late rows only.}
        whatsapp: {type: string, nullable: true, description: Digits with the country code, as wa.me wants; null when the number is too short.}
        message: {type: string}
    MessageTemplate:
      type: object
      properties:
        key: {type: string, enum: [reminder_due, reminder_late]}
        language: {type: string, enum: [en, ar, fr, es, ur]}
        body: {type: string}
        default_body: {type: string}
        custom: {type: boolean}
    AppNotification:
      type: object
      properties:
        id: {type: string, format: uuid}
        type: {type: string, enum: [daily_digest, instalment_due, instalment_late]}
        title: {type: string}
        body: {type: string}
        data: {type: object, additionalProperties: {type: string}, description: "route: where tapping it leads in the app."}
        read: {type: boolean}
        created_at: {type: string, format: date-time}
    NotificationPreferences:
      type: object
      properties:
        daily_digest: {type: object, properties: {enabled: {type: boolean}, time: {type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", default: "09:00"}, channels: {$ref: "#/components/schemas/NotificationChannels"}}}
        instalment_due: {type: object, properties: {enabled: {type: boolean, default: false}, channels: {$ref: "#/components/schemas/NotificationChannels"}}}
        instalment_late: {type: object, properties: {enabled: {type: boolean, default: true}, repeat: {type: string, enum: [daily, weekly, monthly], default: weekly}, channels: {$ref: "#/components/schemas/NotificationChannels"}}}
        day_close_reminder: {type: object, description: "The evening reminder to close the day: from the workspace's closing time, for up to two hours and never past midnight, to everyone who may close.", properties: {enabled: {type: boolean, default: true}, channels: {$ref: "#/components/schemas/NotificationChannels"}}}
        day_close_difference: {type: object, description: "Owners only: someone else closed a day and the cash counted did not match.", properties: {enabled: {type: boolean, default: true}, channels: {$ref: "#/components/schemas/NotificationChannels"}}}
        billing_renewal_due: {type: object, description: "Seven days and one day before a plan that does not renew by itself ends.", properties: {enabled: {type: boolean, default: true}, channels: {$ref: "#/components/schemas/NotificationChannels"}}}
        billing_renewed: {type: object, description: "A store renewal, or a bank transfer the team confirmed.", properties: {enabled: {type: boolean, default: true}, channels: {$ref: "#/components/schemas/NotificationChannels"}}}
        billing_payment_failed: {type: object, description: "The store could not take a payment, or a transfer was not confirmed.", properties: {enabled: {type: boolean, default: true}, channels: {$ref: "#/components/schemas/NotificationChannels"}}}
        billing_expired: {type: object, description: "The plan has ended; the workspace is on Free, nothing deleted.", properties: {enabled: {type: boolean, default: true}, channels: {$ref: "#/components/schemas/NotificationChannels"}}}
        support_reply: {type: object, properties: {enabled: {type: boolean, default: true}, channels: {$ref: "#/components/schemas/NotificationChannels"}}}
        quiet_hours: {type: object, properties: {enabled: {type: boolean, default: false}, from: {type: string, default: "22:00"}, to: {type: string, default: "08:00"}}}
    NotificationChannels:
      type: object
      description: "Where a kind reaches the person. Defaults: alerts in the app only; billing and support in the app and by e-mail."
      properties:
        push: {type: boolean, description: "In the app: the inbox, and a push to each phone."}
        email: {type: boolean}
        sms: {type: boolean}
    NotificationChoices:
      type: object
      properties:
        kinds:
          type: array
          items: {type: object, properties: {key: {type: string}, group: {type: string, enum: [alerts, billing, support]}, label: {type: string}, description: {type: string}}}
        channels:
          type: object
          description: "Each channel: whether it is set up for this person (e-mail needs a verified address; text messages a provider), and its name."
          additionalProperties: {type: object, properties: {available: {type: boolean}, label: {type: string}}}
        allowed:
          type: object
          description: "What the admin allows, kind by kind and channel by channel."
          additionalProperties: {$ref: "#/components/schemas/NotificationChannels"}
    EarlySettlementQuote:
      type: object
      properties:
        remaining: {type: string, example: "825.00"}
        late_fees: {type: string, example: "0.00", description: "Open late fees, added to the payoff whole: a rebate never comes off a fee."}
        earned_profit: {type: string, example: "25.00"}
        unearned_profit: {type: string, example: "75.00"}
        rebate: {type: string, example: "37.50"}
        payoff: {type: string, example: "787.50"}
        capped: {type: boolean, description: The rebate asked for was more than the profit not yet earned.}
        rebate_type: {type: string, enum: [none, percent, fixed]}
        rebate_value: {type: string}
    AmendmentInput:
      type: object
      required: [type]
      properties:
        type: {type: string, enum: [reschedule, skip, move]}
        count: {type: integer, minimum: 1, maximum: 600, description: "reschedule: what is left over this many instalments."}
        amount: {type: string, description: "reschedule: what is left at this amount each, the remainder last."}
        first_due_date: {type: string, format: date, description: "reschedule: the first new instalment."}
        frequency: {type: string, description: "reschedule: defaults to the contract's."}
        installment_id: {type: string, format: uuid, description: "skip and move: an instalment nobody has paid towards."}
        due_date: {type: string, format: date, description: "move: its new date."}
    ScheduleRow:
      type: object
      properties:
        number: {type: integer}
        due_date: {type: string, format: date}
        amount: {type: string}
    ContractAmendment:
      type: object
      properties:
        id: {type: string, format: uuid}
        type: {type: string, enum: [reschedule, skip, move]}
        reason: {type: string}
        old_schedule: {type: array, items: {$ref: "#/components/schemas/ScheduleRow"}}
        new_schedule: {type: array, items: {$ref: "#/components/schemas/ScheduleRow"}}
        approved_by: {type: [object, "null"], properties: {id: {type: string}, name: {type: string}}}
        created_at: {type: string, format: date-time}
    Tag:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        colour: {type: string, enum: [grey, gold, green, blue, red, purple]}
        customers: {type: integer, description: How many customers have it (listing only).}
    TagInput:
      type: object
      required: [name]
      properties:
        name: {type: string, maxLength: 40}
        colour: {type: string, enum: [grey, gold, green, blue, red, purple], default: grey}
    WorkspaceExport:
      type: object
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [nightly, manual]}
        format: {type: string, enum: [xlsx, csv]}
        status: {type: string, enum: [pending, ready, failed]}
        size: {type: integer, description: Bytes of the file.}
        row_counts: {type: object, additionalProperties: {type: integer}, description: "Rows per sheet: customers, contracts, instalments, payments, items, investors, investor_entries."}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time, nullable: true}
    ActivityEntry:
      type: object
      properties:
        id: {type: string, format: uuid}
        at: {type: string, format: date-time, description: On the business's own clock.}
        action: {type: string, example: payment.recorded}
        kind: {type: string, nullable: true, enum: [customers, contracts, payments, investors, products, team, settings]}
        summary: {type: string, example: "Payment recorded: SAR 150.00 on C-0001"}
        person: {type: object, nullable: true, properties: {id: {type: string, format: uuid}, name: {type: string}}}
    BusinessProfile:
      type: object
      properties:
        name_ar: {type: string, nullable: true}
        name_en: {type: string, nullable: true}
        phone: {type: string, nullable: true}
        address: {type: string, nullable: true}
        cr_number: {type: string, nullable: true}
        vat_number: {type: string, nullable: true}
        footer: {type: string, nullable: true, description: Printed at the foot of every page when the plan includes custom branding.}
        logo: {type: string, nullable: true, description: "A data URI (data:image/png;base64,...); printed when the plan includes custom branding."}
        signature: {type: string, nullable: true, description: A data URI of a PNG.}
    BusinessProfileInput:
      type: object
      properties:
        name_ar: {type: string, maxLength: 120, nullable: true}
        name_en: {type: string, maxLength: 120, nullable: true}
        phone: {type: string, maxLength: 40, nullable: true}
        address: {type: string, maxLength: 255, nullable: true}
        cr_number: {type: string, maxLength: 40, nullable: true}
        vat_number: {type: string, maxLength: 40, nullable: true}
        footer: {type: string, maxLength: 255, nullable: true}
    DocumentPreferences:
      type: object
      properties:
        paper: {type: string, enum: [a4, a5]}
        text: {type: string, enum: [small, normal, large]}
        sections: {type: object, properties: {cost: {type: boolean}, overdue: {type: boolean}, schedule: {type: boolean}, signature: {type: boolean}}}
        wording:
          type: object
          description: The workspace's own words for these terms, up to 30 characters each; only the renamed ones are listed.
          properties: {customer: {type: string}, contract: {type: string}, investor: {type: string}, instalment: {type: string}}
    Investor:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string, description: "The main investor reads \"Own capital\" in the reader's language until renamed."}
        is_main: {type: boolean}
        commercial_registration: {type: string, nullable: true}
        currency: {type: string, example: SAR}
        commission_percent: {type: string, example: "15.00"}
        notes: {type: string, nullable: true}
        archived: {type: boolean}
        summary:
          type: object
          properties:
            wallet: {$ref: "#/components/schemas/Money"}
            out_in_contracts: {$ref: "#/components/schemas/Money"}
            profit_earned: {$ref: "#/components/schemas/Money"}
            profit_expected: {$ref: "#/components/schemas/Money"}
            customers: {type: integer}
            contracts: {type: integer}
    InvestorEntry:
      type: object
      description: One line of an investor's money, signed for their wallet. Payments credit principal_back and profit_share (and a partner's commission) by themselves.
      properties:
        id: {type: string, format: uuid}
        type: {type: string, enum: [deposit, withdrawal, funding_out, funding_back, principal_back, profit_share, commission]}
        amount: {$ref: "#/components/schemas/Money"}
        occurred_on: {type: string, format: date}
        note: {type: string, nullable: true}
        contract: {type: object, nullable: true, properties: {id: {type: string, format: uuid}, reference: {type: string}}}
        reverses_entry_id: {type: string, format: uuid, nullable: true}
        reversed: {type: boolean}
        reversible: {type: boolean, description: A deposit or withdrawal not reversed yet.}
        created_at: {type: string, format: date-time}
    TeamMember:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        email: {type: string}
        role: {type: string, enum: [owner, manager, accountant, collector, viewer]}
        joined_at: {type: string, format: date-time, nullable: true}
    Invitation:
      type: object
      properties:
        id: {type: string, format: uuid}
        role: {type: string, enum: [manager, accountant, collector, viewer]}
        name: {type: string, nullable: true}
        email: {type: string, nullable: true}
        phone: {type: string, nullable: true}
        invited_by: {type: string, nullable: true}
        expires_at: {type: string, format: date-time}
    PlanRef:
      type: object
      properties:
        key: {type: string, example: free}
        name: {type: string}
    Entitlements:
      type: object
      description: One entry per feature, keyed by feature (customers, active_contracts, pdf_statements, export_csv, advanced_reports, custom_branding, api_tokens).
      additionalProperties: {$ref: "#/components/schemas/Entitlement"}
    Entitlement:
      type: object
      properties:
        type: {type: string, enum: [toggle, limit, quota]}
        status: {type: string, enum: ["on", plan_locked, platform_off], description: "on: usable. plan_locked: the plan lacks it (offer an upgrade). platform_off: switched off by the platform (show nothing)."}
        detail: {type: [string, "null"], description: "dependency:<key> when another feature is the reason; otherwise null."}
        enabled: {type: boolean, description: "true exactly when status is on."}
        limit: {type: [integer, "null"], description: "null means unlimited for counted features."}
        used: {type: [integer, "null"]}
        remaining: {type: [integer, "null"]}
        unlimited: {type: boolean}
    Appearance:
      type: object
      properties:
        version: {type: integer, description: "0 for the factory look, then 1, 2, 3 for each published version."}
        custom: {type: boolean, description: Whether any colour differs from the factory look.}
        tokens:
          type: object
          properties:
            light: {$ref: "#/components/schemas/Palette"}
            dark: {$ref: "#/components/schemas/Palette"}
        logo_url: {type: [string, "null"], format: uri}
        logo_dark_url: {type: [string, "null"], format: uri, description: The logo for dark backgrounds.}
        banner:
          oneOf:
            - type: "null"
            - type: object
              properties:
                title: {type: string}
                message: {type: string}
                cta_label: {type: string}
                cta_url: {type: [string, "null"], description: "A page of the site (starting with /) or an https address."}
                tone: {type: string, enum: [gold, navy, sand, sky]}
                dismissible: {type: boolean}
                image_url: {type: [string, "null"], format: uri}
                ends_on: {type: [string, "null"], format: date, description: "Its last day, so a kept banner stops on time offline."}
                key: {type: string, description: Changes whenever the banner changes; remember a dismissal by it.}
        event:
          description: The event theme being worn, or null for the usual look.
          oneOf:
            - type: "null"
            - type: object
              properties:
                id: {type: string, format: uuid}
                name: {type: string}
                ends_on: {type: string, format: date, description: Its last day, in its own time zone.}
                until: {type: string, format: date-time, description: The first moment after its last day (UTC).}
        base:
          description: While an event is on, the usual look to go back to when it ends; null otherwise.
          oneOf:
            - type: "null"
            - type: object
              properties:
                tokens:
                  type: object
                  properties:
                    light: {$ref: "#/components/schemas/Palette"}
                    dark: {$ref: "#/components/schemas/Palette"}
                logo_url: {type: [string, "null"], format: uri}
                logo_dark_url: {type: [string, "null"], format: uri}
                banner: {description: "The usual banner for the Android app, shaped like `banner` above, or null."}
    Palette:
      type: object
      description: The theme engine's 26 colour tokens, each "#RRGGBB".
      additionalProperties: {type: string, pattern: "^#[0-9A-F]{6}$"}
      example: {primary: "#0B1F44", onPrimary: "#F7F3EA", accent: "#C9A25B", bg: "#F7F3EA"}
    Plan:
      type: object
      properties:
        key: {type: string}
        name: {type: string}
        description: "{type: [string, \"null\"]}"
        is_free: {type: boolean}
        currency: {type: string}
        monthly_price: {oneOf: [{$ref: "#/components/schemas/Money"}, {type: "null"}]}
        yearly_price: {oneOf: [{$ref: "#/components/schemas/Money"}, {type: "null"}]}
        yearly_saving_percent: {type: [integer, "null"]}
        features:
          type: object
          additionalProperties:
            type: object
            properties:
              type: {type: string}
              label: {type: string}
              enabled: {type: boolean}
              limit: {type: [integer, "null"]}
              summary: "{type: string, example: Up to 5 customers}"
    Dashboard:
      type: object
      properties:
        currency: {type: string}
        outstanding: {$ref: "#/components/schemas/Money"}
        overdue: {$ref: "#/components/schemas/Money"}
        collected_this_month: {$ref: "#/components/schemas/Money"}
        active_customers: {type: integer}
        collection_rate: {type: [string, "null"]}
        due_today:
          type: array
          items: {$ref: "#/components/schemas/DueInstallment"}
        expected_this_month: {$ref: "#/components/schemas/Money", description: What falls due this calendar month, paid or not.}
        collected_last_month: {$ref: "#/components/schemas/Money", description: Net money received last calendar month, to compare with this month.}
        overdue_list:
          type: array
          description: The oldest unpaid instalments that fell due before today (at most 25), each with how many days late.
          items:
            allOf:
              - {$ref: "#/components/schemas/DueInstallment"}
              - type: object
                properties:
                  days_late: {type: integer, minimum: 1}
        upcoming:
          type: array
          description: Unpaid instalments falling due in the next seven days, soonest first (at most 25).
          items:
            allOf:
              - {$ref: "#/components/schemas/DueInstallment"}
              - type: object
                properties:
                  days_until: {type: integer, minimum: 1}
        daily_collected:
          type: array
          description: The last fourteen days including today, oldest first, for a small chart. Net of voids.
          items:
            type: object
            properties:
              date: {type: string, format: date}
              amount: {$ref: "#/components/schemas/Money"}
    Glance:
      type: object
      required: [enabled, currency, due_count, due_amount, late_count, late_amount, next, generated_at]
      properties:
        enabled: {type: boolean, enum: [true]}
        currency: {type: string, example: SAR}
        due_count: {type: integer, description: Instalments due today, or due already and still inside their grace days.}
        due_amount: {$ref: "#/components/schemas/Money"}
        late_count: {type: integer, description: Instalments past their last day of grace.}
        late_amount: {$ref: "#/components/schemas/Money"}
        next:
          type: array
          maxItems: 3
          description: The first three of those due today (oldest first), then those coming up in the next seven days (soonest first).
          items:
            type: object
            required: [reference, amount, due_on]
            properties:
              reference: {type: string, example: C-0042, description: The contract's number.}
              amount: {$ref: "#/components/schemas/Money", description: What is still owed on the instalment.}
              due_on: {type: string, format: date}
              name: {type: string, description: The customer's name. Only when the request passed `names=1`.}
        generated_at: {type: string, format: date-time, description: When the snapshot was made.}
    GlanceOff:
      type: object
      required: [enabled]
      description: The whole answer when the home-screen widget feature is not enabled for the workspace.
      properties:
        enabled: {type: boolean, enum: [false]}
    DueInstallment:
      type: object
      properties:
        installment_id: {type: string}
        contract_id: {type: string}
        contract_reference: {type: string}
        customer_id: {type: string}
        customer_name: {type: string}
        customer_phone: {type: string}
        amount_due: {$ref: "#/components/schemas/Money"}
        due_date: {type: string, format: date}
    CustomerInput:
      type: object
      required: [name, phone]
      properties:
        name: {type: string, maxLength: 255}
        phone: {type: string, description: "6 to 15 digits; Arabic-Indic digits are accepted."}
        phone_secondary: {type: [string, "null"]}
        email: {type: [string, "null"], format: email}
        national_id: {type: [string, "null"], maxLength: 40}
        address: {type: [string, "null"]}
        notes: {type: [string, "null"]}
        remove_national_id: {type: boolean, description: "Only when changing a customer."}
        job: {type: [string, "null"], maxLength: 120}
        tags: {type: [array, "null"], items: {type: string, format: uuid}, description: "The customer's tags, all of them each time (empty clears them). Needs the customer_tags feature."}
    Customer:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        phone: {type: string}
        phone_secondary: {type: [string, "null"]}
        email: {type: [string, "null"]}
        national_id: {type: [string, "null"], description: "Only ever masked: the last three digits."}
        address: {type: [string, "null"]}
        notes: {type: [string, "null"]}
        job: {type: [string, "null"]}
        pinned: {type: boolean, description: Pinned customers come first in every list.}
        tags: {type: array, items: {$ref: "#/components/schemas/Tag"}}
        last_activity_at: {type: [string, "null"], format: date-time, description: Their newest contract or payment, else when they were added.}
        created_at: {type: string, format: date-time}
        owed: {$ref: "#/components/schemas/Money"}
        running_contracts: {type: integer}
        contracts: {type: array, items: {$ref: "#/components/schemas/Contract"}}
        pay_pattern:
          oneOf: [{$ref: "#/components/schemas/PayPattern"}, {type: "null"}]
          description: >-
            The day of the month this customer usually pays on, worked out from their payments. It is on the customer's own
            page (`GET /customers/{customer}`) and nowhere else: never in the list, and not in what adding, changing or
            pinning a customer answers. It is there only while the `payday_learning` feature is on for the workspace (the
            platform switch and the plan); with it off the key is left out altogether, and a pattern worked out earlier is
            kept for when it is switched back on. With the feature on, `null` means there is not enough to say yet.
    PayPattern:
      type: object
      description: >-
        When a customer usually pays, for a chip next to their name ("Usually pays around day 27 of the month") and for
        suggesting contract dates. It is worked out from the first payment of each of their last months with payments, on
        monthly contracts, and is a hint: nothing changes by itself because of it. `label` and `basis` are written by the
        server in the language of the request; show them as sent and never build the wording from the figures.
      required: [day, spread, months, within, confidence, end_of_month, label, basis]
      properties:
        day: {type: integer, minimum: 1, maximum: 28, description: "The usual day of the month. 28 also stands for the 29th to the 31st (see `end_of_month`); suggest dates from it, clamped to the length of the month."}
        spread: {type: integer, minimum: 0, maximum: 27, description: "How far apart the days run, in days: the middle half of the months fall within this many days of each other."}
        months: {type: integer, minimum: 3, maximum: 12, description: How many months it was worked out from.}
        within: {type: integer, minimum: 0, maximum: 100, description: The percent of those months paid within three days of `day`.}
        confidence: {type: string, enum: [high, medium], description: "high is four months or more that agree closely; medium is a looser pattern, or one from only three months."}
        end_of_month: {type: boolean, description: True when `day` is 28, that is the customer pays at the end of the month whatever its length.}
        label:
          type: string
          example: "Usually pays around day 27 of the month"
          description: >-
            One line in the language of the request: "Usually pays around day 27 of the month", or "Usually pays at the end of
            the month" when `end_of_month` is true.
        basis:
          type: string
          example: "Seen in 83% of recent months"
          description: A second, smaller line saying how sure it is (`within` as a percent of the recent months), in the language of the request.
    CustomerPage:
      allOf:
        - {$ref: "#/components/schemas/Page"}
        - type: object
          properties:
            data: {type: array, items: {$ref: "#/components/schemas/Customer"}}
    ContractInput:
      type: object
      required: [customer_id, principal]
      properties:
        customer_id: {type: string, format: uuid}
        type: {type: string, enum: [scheduled, cash, open], default: scheduled, description: "open needs the open_contracts feature: no schedule and no price, only opening_balance and credit_limit."}
        opening_balance: {$ref: "#/components/schemas/Money"}
        credit_limit: {$ref: "#/components/schemas/Money"}
        principal: {$ref: "#/components/schemas/Money"}
        down_payment: {$ref: "#/components/schemas/Money"}
        markup_type: {type: string, enum: [none, fixed, percent]}
        markup_value: {type: string, example: "10"}
        installment_count: {type: integer, minimum: 1, maximum: 600, description: "Above 120 needs the flexible_schedules feature. Not used for custom."}
        frequency: {type: string, enum: [daily, weekly, biweekly, monthly, bimonthly, quarterly, semiannual, yearly, custom], description: "Anything but weekly, biweekly and monthly needs the flexible_schedules feature (403 feature_unavailable without it); custom means the rows in custom_schedule."}
        grace_days: {type: integer, minimum: 0, maximum: 90, description: "Days after a due date before the instalment counts as late (needs flexible_schedules when above 0)."}
        custom_schedule:
          type: array
          maxItems: 600
          description: "With frequency custom, the shop’s own rows: dates strictly increasing, adding up to the total exactly (otherwise 422 naming the row or the difference)."
          items:
            type: object
            required: [due_date, amount]
            properties:
              due_date: {type: string, format: date}
              amount: {$ref: "#/components/schemas/Money"}
        start_date: {type: string, format: date}
        first_due_date: {type: string, format: date, description: Not used for custom.}
        notes: {type: string}
        investor_id: {type: string, format: uuid, description: "Who funds it; the business's own capital when left out. A partner needs the investors feature; collectors may not choose (422)."}
        title: {type: string, maxLength: 120, description: "What was sold, in a line. This and the fields below need the contract_items feature."}
        own_reference: {type: string, maxLength: 40, description: "The shop's own number, unique in the workspace whatever its case; it then names the contract instead of C-0001."}
        cost_price: {$ref: "#/components/schemas/Money"}
        tax_percent: {type: string, example: "15", description: "The tax already in the price, shown on documents."}
        discount_type: {type: string, enum: [none, fixed, percent], description: "Taken off the price before the down payment; the schedule is built on what is left."}
        discount_value: {type: string, example: "10"}
        items:
          type: array
          maxItems: 10
          description: "What was sold. A 15-digit serial is an IMEI and must pass its check digit (422). A serial already on another running contract warns in meta.warnings and never refuses."
          items:
            type: object
            required: [name]
            properties:
              name: {type: string, maxLength: 120}
              quantity: {type: integer, minimum: 1, maximum: 999}
              serial: {type: string, maxLength: 60}
              cost: {$ref: "#/components/schemas/Money"}
              price: {$ref: "#/components/schemas/Money"}
              product_id: {type: string, format: uuid}
    PreviewInput:
      type: object
      required: [principal, frequency]
      properties:
        principal: {$ref: "#/components/schemas/Money"}
        down_payment: {$ref: "#/components/schemas/Money"}
        markup_type: {type: string, enum: [none, fixed, percent]}
        markup_value: {type: string}
        count: {type: integer, minimum: 1, maximum: 600, description: Required unless frequency is custom.}
        frequency: {type: string, enum: [daily, weekly, biweekly, monthly, bimonthly, quarterly, semiannual, yearly, custom], description: "Anything but weekly, biweekly and monthly needs the flexible_schedules feature (403 feature_unavailable without it); custom means the rows in custom_schedule."}
        first_due_date: {type: string, format: date}
        custom_schedule:
          type: array
          maxItems: 600
          description: "With frequency custom, the shop’s own rows: dates strictly increasing, adding up to the total exactly (otherwise 422 naming the row or the difference)."
          items:
            type: object
            required: [due_date, amount]
            properties:
              due_date: {type: string, format: date}
              amount: {$ref: "#/components/schemas/Money"}
    Schedule:
      type: object
      properties:
        financed: {$ref: "#/components/schemas/Money"}
        markup: {$ref: "#/components/schemas/Money"}
        total: {$ref: "#/components/schemas/Money"}
        installments:
          type: array
          items:
            type: object
            properties:
              number: {type: integer}
              due_date: {type: string, format: date}
              amount: {$ref: "#/components/schemas/Money"}
    Contract:
      type: object
      properties:
        id: {type: string, format: uuid}
        reference: {type: string, example: C-0012}
        number: {type: integer}
        type: {type: string, enum: [scheduled, cash, open]}
        status: {type: string, enum: [active, settled, cancelled]}
        state: {type: string, enum: [active, late, settled, cancelled]}
        principal: {$ref: "#/components/schemas/Money"}
        down_payment: {$ref: "#/components/schemas/Money"}
        financed: {$ref: "#/components/schemas/Money"}
        markup_type: {type: string}
        markup_value: {$ref: "#/components/schemas/Money"}
        markup_amount: {$ref: "#/components/schemas/Money"}
        total: {$ref: "#/components/schemas/Money"}
        installment_count: {type: integer}
        frequency: {type: string}
        grace_days: {type: integer, description: Days after a due date before the instalment counts as late.}
        credit_limit: {type: [string, "null"], description: "An open contract's limit; past it the app warns and never refuses."}
        title: {type: [string, "null"]}
        own_reference: {type: [string, "null"], description: "When set, `reference` is this."}
        cost_price: {type: [string, "null"]}
        tax_percent: {type: [string, "null"]}
        tax_amount: {type: [string, "null"], description: The tax in the price after any discount.}
        discount_type: {type: string, enum: [none, fixed, percent]}
        discount_value: {$ref: "#/components/schemas/Money"}
        discount_amount: {$ref: "#/components/schemas/Money"}
        items:
          type: array
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              name: {type: string}
              quantity: {type: integer}
              serial: {type: [string, "null"]}
              cost: {type: [string, "null"]}
              price: {type: [string, "null"]}
              product_id: {type: [string, "null"]}
        investor: {type: object, description: Who funded it; left out for collectors., properties: {id: {type: string, format: uuid}, name: {type: string}, is_main: {type: boolean}}}
        start_date: {type: string, format: date}
        first_due_date: {type: string, format: date}
        notes: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
        settled_at: {type: [string, "null"], format: date-time}
        cancelled_at: {type: [string, "null"], format: date-time}
        archived: {type: boolean, description: A finished contract put away; hidden from the lists until status=archived.}
        archived_at: {type: [string, "null"], format: date-time}
        paid_ahead_until: {type: [string, "null"], format: date, description: "Single contract only: the due date the instalments are paid up to, when it is still ahead of today."}
        early_settlement_rebate: {type: [string, "null"], description: "Single contract only: the discount it was settled early with (0.00 if that was voided)."}
        amendments:
          type: array
          description: Single contract only. Every change to the plan, oldest first.
          items: {$ref: "#/components/schemas/ContractAmendment"}
        customer:
          type: object
          properties:
            id: {type: string, format: uuid}
            name: {type: string}
        owed: {$ref: "#/components/schemas/Money"}
        paid: {$ref: "#/components/schemas/Money"}
        next_installment:
          oneOf:
            - type: object
              properties:
                number: {type: integer}
                due_date: {type: string, format: date}
                remaining: {$ref: "#/components/schemas/Money"}
            - {type: "null"}
        late_fee_policy:
          oneOf:
            - {$ref: "#/components/schemas/LateFeePolicy"}
            - {type: "null"}
        late_fees: {type: array, description: Single contract only. Every late fee charged, oldest first., items: {$ref: "#/components/schemas/LateFee"}}
        guarantors: {type: array, description: Single contract only. Up to three, in the order they were added (Win Plan K5)., items: {$ref: "#/components/schemas/Guarantor"}}
        photos: {type: array, description: Single contract only. The photos this person may open, oldest first; ID photos are left out for collectors and viewers., items: {$ref: "#/components/schemas/ContractPhoto"}}
        signature:
          description: Single contract only. The customer's latest signature, or null.
          oneOf:
            - {$ref: "#/components/schemas/ContractSignature"}
            - {type: "null"}
        installments: {type: array, items: {$ref: "#/components/schemas/Installment"}}
        transactions: {type: array, items: {$ref: "#/components/schemas/Transaction"}}
    CashForecast:
      type: object
      properties:
        as_of: {type: string, format: date}
        already_due: {$ref: "#/components/schemas/Money"}
        late_fees: {$ref: "#/components/schemas/Money"}
        windows:
          type: object
          properties:
            days_30: {$ref: "#/components/schemas/Money"}
            days_60: {$ref: "#/components/schemas/Money"}
            days_90: {$ref: "#/components/schemas/Money"}
        weeks:
          type: array
          items: {type: object, properties: {from: {type: string, format: date}, to: {type: string, format: date}, amount: {$ref: "#/components/schemas/Money"}}}
    AgeingBuckets:
      type: object
      properties:
        current: {$ref: "#/components/schemas/Money"}
        days_1_30: {$ref: "#/components/schemas/Money"}
        days_31_60: {$ref: "#/components/schemas/Money"}
        days_61_90: {$ref: "#/components/schemas/Money"}
        days_90_plus: {$ref: "#/components/schemas/Money"}
    Ageing:
      type: object
      properties:
        as_of: {type: string, format: date}
        buckets: {$ref: "#/components/schemas/AgeingBuckets"}
        total: {$ref: "#/components/schemas/Money"}
        contracts:
          type: array
          items:
            allOf:
              - {$ref: "#/components/schemas/AgeingBuckets"}
              - type: object
                properties:
                  id: {type: string, format: uuid}
                  reference: {type: string}
                  customer: {type: object, properties: {id: {type: string}, name: {type: [string, "null"]}}}
                  total: {$ref: "#/components/schemas/Money"}
    ProfitReport:
      type: object
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
        total: {$ref: "#/components/schemas/Money"}
        collection_rate: {type: [string, "null"], example: "75.0", description: "Of what fell due in the period, the percent paid so far; null when nothing fell due."}
        months: {type: array, items: {type: object, properties: {month: {type: string, example: "2026-02"}, profit: {$ref: "#/components/schemas/Money"}}}}
        investors: {type: array, items: {type: object, properties: {id: {type: string, format: uuid}, name: {type: string}, profit: {$ref: "#/components/schemas/Money"}}}}
        products: {type: array, description: "id null: items not from the products list, or no items.", items: {type: object, properties: {id: {type: [string, "null"]}, name: {type: string}, profit: {$ref: "#/components/schemas/Money"}}}}
        late_fees: {type: object, properties: {shop: {$ref: "#/components/schemas/Money"}, charity: {$ref: "#/components/schemas/Money"}}}
    LateFeePolicy:
      type: object
      description: The workspace's late-fee policy as it stood when the contract was made (Win Plan K4); a later change never alters it.
      properties:
        type: {type: string, enum: [fixed, percent], description: "fixed: an amount; percent: of what is still owed on the instalment when the fee is charged."}
        amount: {type: string, example: "10.00"}
        frequency: {type: string, enum: [once, daily, weekly, monthly], description: From the day after the instalment's grace days.}
        cap_installment: {type: [string, "null"], description: "The most an instalment's fees add up to (waived ones count); null for no cap."}
        cap_contract: {type: [string, "null"], description: The same for the whole contract.}
        charity: {type: boolean, description: The fees go to charity and are kept apart from the business's income.}
    Guarantor:
      type: object
      description: Someone who stands behind a contract (Win Plan K5).
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        phone: {type: string}
        relation: {type: [string, "null"], description: How they know the customer.}
        national_id: {type: [string, "null"], example: "••••••432", description: Masked; null when there is none, and always null for collectors and viewers.}
        created_at: {type: string, format: date-time}
    GuarantorInput:
      type: object
      required: [name, phone]
      properties:
        name: {type: string, maxLength: 255}
        phone: {type: string, example: "0501234567", description: 6 to 15 digits with the usual separators and an optional +.}
        relation: {type: [string, "null"], maxLength: 60}
        national_id: {type: [string, "null"], maxLength: 40}
    ContractSignature:
      type: object
      description: The customer's signature on a contract (Win Plan K5).
      properties:
        name: {type: string, description: The customer's name when they signed.}
        method: {type: string, enum: [screen, link], description: On the owner's screen, or through a link on their own phone.}
        signed_at: {type: string, format: date-time}
        image: {type: string, example: "data:image/png;base64,iVBORw0KGgo...", description: The signature as a PNG data URI.}
    ContractPhoto:
      type: object
      description: A photo kept with a contract (Win Plan K5).
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [id_front, id_back, contract_photo, invoice]}
        label: {type: string, example: Invoice}
        mime: {type: string, example: image/jpeg}
        size: {type: integer}
        private: {type: boolean, description: "An ID photo. It has no url here; open it with GET /files/{file}, which is audited."}
        url: {type: [string, "null"], format: uri, description: A link that works for five minutes; null when private.}
        created_at: {type: string, format: date-time}
    Import:
      type: object
      description: A file of customers being brought in (Win Plan K9).
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [trial, done]}
        source: {type: string, enum: [xlsx, csv, ai]}
        filename: {type: string}
        columns:
          type: array
          items:
            type: object
            properties:
              index: {type: integer}
              header: {type: string}
              field: {type: [string, "null"]}
        fields:
          type: array
          description: The fields a column can be taken as, with their names in the asker's language.
          items: {type: object, properties: {key: {type: string}, label: {type: string}}}
        rows:
          type: array
          items:
            type: object
            properties:
              row: {type: integer, description: The row's number in the sheet (the header is row 1).}
              name: {type: [string, "null"]}
              phone: {type: [string, "null"]}
              national_id: {type: [string, "null"], description: Masked.}
              customer_id: {type: [string, "null"], format: uuid, description: The customer it adds to (existing), or that it made (once done).}
              action: {type: string, enum: [new, existing, skip]}
              contract:
                oneOf:
                  - {type: "null"}
                  - type: object
                    properties:
                      type: {type: string, enum: [scheduled, open]}
                      total: {type: [string, "null"]}
                      paid: {type: [string, "null"]}
                      balance: {type: string}
                      installments: {type: [integer, "null"]}
                      first_due: {type: [string, "null"], format: date}
                      start: {type: string, format: date}
                      item: {type: [string, "null"]}
              problems:
                type: array
                items: {type: object, properties: {column: {type: string}, field: {type: string}, message: {type: string}}}
              note: {type: [string, "null"]}
        summary:
          type: object
          properties:
            rows: {type: integer}
            ready: {type: integer}
            problems: {type: integer}
            skipped: {type: integer}
            customers: {type: integer}
            contracts: {type: integer}
            balance: {type: string}
        created_at: {type: string, format: date-time}
        confirmed_at: {type: [string, "null"], format: date-time}
    LateFee:
      type: object
      description: One fee for one period an instalment was late, its own line (never added to the instalment).
      properties:
        id: {type: string, format: uuid}
        installment_id: {type: string, format: uuid}
        installment_number: {type: integer}
        period: {type: integer, description: 1 for the first period late, 2 for the next, and so on.}
        charged_on: {type: string, format: date, description: "The first day of that period, on the workspace's calendar."}
        amount: {$ref: "#/components/schemas/Money"}
        paid_amount: {$ref: "#/components/schemas/Money"}
        remaining: {$ref: "#/components/schemas/Money"}
        status: {type: string, enum: [open, paid, waived]}
        charity: {type: boolean}
        waived_reason: {type: [string, "null"]}
        waived_at: {type: [string, "null"], format: date-time}
        waived_by: {type: [object, "null"], properties: {id: {type: string}, name: {type: string}}}
    ContractPage:
      allOf:
        - {$ref: "#/components/schemas/Page"}
        - type: object
          properties:
            data: {type: array, items: {$ref: "#/components/schemas/Contract"}}
    Installment:
      type: object
      properties:
        id: {type: string, format: uuid}
        number: {type: integer}
        due_date: {type: string, format: date}
        amount: {$ref: "#/components/schemas/Money"}
        paid_amount: {$ref: "#/components/schemas/Money"}
        remaining: {$ref: "#/components/schemas/Money"}
        status: {type: string, enum: [pending, partial, paid, superseded, waived]}
        state: {type: string, enum: [paid, overdue, partial, upcoming, superseded, waived], description: "What a person should see. Superseded: set aside by a plan change or a conversion to open. Waived: what an early-settlement rebate took off."}
        paid_at: {type: [string, "null"], format: date-time}
    PaymentInput:
      type: object
      required: [amount, method]
      properties:
        amount: {$ref: "#/components/schemas/Money"}
        method: {type: string, enum: [cash, bank_transfer, card, cheque, other]}
        paid_at: {type: string, description: "A date or a moment, never in the future. A date alone means that day on the workspace's calendar; a moment with an offset or Z is that instant, and one without an offset is read as UTC."}
        note: {type: string, maxLength: 1000}
        tag: {type: string, enum: [advance, refund, early_discount, unpaid]}
        idempotency_key: {type: string, description: "The Idempotency-Key header may be used instead."}
        apply_to: {type: string, format: uuid, description: "An instalment of this contract to fill first; the rest goes to the oldest. Needs the payment_targeting feature."}
    ChargeResult:
      type: object
      properties:
        data: {$ref: "#/components/schemas/Transaction"}
        meta:
          type: object
          properties:
            balance: {$ref: "#/components/schemas/Money"}
            over_credit_limit: {type: boolean}
    ConversionOutcome:
      type: object
      properties:
        superseded: {type: integer, description: Unpaid instalments set aside.}
        opening_balance: {$ref: "#/components/schemas/Money"}
        late_fees: {type: string, description: "Open late fees: while more than zero, converting answers 422 until they are collected or waived."}
    Transaction:
      type: object
      description: >-
        One line of the immutable money ledger. Amounts are signed; a reversal is negative. A charge (what an open
        contract's customer took) is owed, not received: /payments lists money in only.
      properties:
        id: {type: string, format: uuid}
        type: {type: string, enum: [payment, down_payment, reversal, charge, charge_reversal]}
        tag: {type: [string, "null"], enum: [advance, refund, early_discount, unpaid, imported, null], description: "`imported` marks what an import brought in as paid before Qistas; only the import writes it, a request may not send it."}
        balance_after: {type: string, description: "On an open contract's ledger: the balance once this line was written."}
        recorded_by: {type: [object, "null"], properties: {id: {type: string}, name: {type: string}}, description: Who wrote the line; null for lines the system wrote.}
        recorded_at: {type: string, format: date-time, description: When the line was written (paid_at is when the money moved).}
        reversal:
          type: object
          description: On a voided line, who voided it, when and why.
          properties:
            id: {type: string, format: uuid}
            by: {type: [object, "null"], properties: {id: {type: string}, name: {type: string}}}
            reason: {type: [string, "null"]}
            at: {type: string, format: date-time}
        method: {type: string}
        amount: {$ref: "#/components/schemas/Money"}
        paid_at: {type: string, format: date-time}
        note: {type: [string, "null"]}
        voided: {type: boolean}
        reverses_transaction_id: {type: [string, "null"]}
        created_by:
          type: [object, "null"]
          properties:
            id: {type: string}
            name: {type: string}
        customer:
          type: [object, "null"]
          properties:
            id: {type: string}
            name: {type: string}
        contract:
          type: object
          properties:
            id: {type: string}
            reference: {type: string}
            status: {type: string}
            owed: {$ref: "#/components/schemas/Money"}
    TransactionPage:
      allOf:
        - {$ref: "#/components/schemas/Page"}
        - type: object
          properties:
            data: {type: array, items: {$ref: "#/components/schemas/Transaction"}}
    DayCloseInput:
      type: object
      required: [counted_cash]
      properties:
        counted_cash: {type: string, example: "3100.00", description: "The cash in the till: an amount with at most two decimals, not negative, written as text."}
        note: {type: [string, "null"], maxLength: 1000}
        day: {type: [string, "null"], format: date, description: "The workspace's own calendar day to close: today (the default) or one of the seven days before it."}
    DayCloseFigures:
      type: object
      required: [by_method, count, per_member]
      description: The day's figures, as they were when it was closed.
      properties:
        by_method: {type: object, additionalProperties: {$ref: "#/components/schemas/Money"}, description: "The net of each way of paying that had a line in the day (an empty object when none), cash first."}
        count: {type: integer, description: "Payments taken in the day that were not voided in it: a payment across a customer's contracts is one, until all of its lines are voided."}
        per_member:
          type: object
          description: "The cash side of the day by the person who recorded each line, keyed by user id (`unknown` for someone who has since left the team); an empty object when there was none."
          additionalProperties:
            type: object
            required: [name, cash, count]
            properties:
              name: {type: string}
              cash: {$ref: "#/components/schemas/Money"}
              count: {type: integer}
    DayClose:
      type: object
      description: >-
        One close of one day, as it was signed. A close is a record and is never edited: reopening a day moves its `status`
        and writes who reopened it and why, and closing the day again writes the next `version`.
      required: [id, day, version, status, expected_cash, counted_cash, difference, totals, note, closed_by, closed_at, reopened_by, reopened_at, reopen_reason, snapshot_hash, summary_text, summary_url]
      properties:
        id: {type: string, format: uuid}
        day: {type: string, format: date, description: The workspace's own calendar day.}
        version: {type: integer, minimum: 1}
        status: {type: string, enum: [closed, reopened]}
        expected_cash: {$ref: "#/components/schemas/Money", description: What was recorded in cash for the day.}
        counted_cash: {$ref: "#/components/schemas/Money", description: What the person counted.}
        difference: {$ref: "#/components/schemas/Money", description: Counted less expected. Negative is short, positive is over.}
        totals: {$ref: "#/components/schemas/DayCloseFigures"}
        note: {type: [string, "null"]}
        closed_by: {type: [object, "null"], properties: {id: {type: string}, name: {type: string}}, description: Who closed it; null once that person has left the team.}
        closed_at: {type: string, format: date-time}
        reopened_by: {type: [object, "null"], properties: {id: {type: string}, name: {type: string}}}
        reopened_at: {type: [string, "null"], format: date-time}
        reopen_reason: {type: [string, "null"]}
        snapshot_hash: {type: string, pattern: '^[0-9a-f]{64}$', description: A SHA-256 of the day's figures when it was closed.}
        summary_text:
          type: string
          example: "Al-Fares, 21 Oct: collected SAR 8,420 (cash 3,100, other 5,320), 14 payments, difference 0."
          description: >-
            One sentence the person can share (on WhatsApp, say), in the language of the request: the shop, the day, what was
            collected and how, how many payments, and whether the cash balanced (`difference 0`, `over by SAR 12.50` or
            `short by SAR 12.50`). Show it as it is; never build it on the device.
        summary_url: {type: string, format: uri, description: The signed PDF (GET, with the bearer token).}
    DayClosePage:
      allOf:
        - {$ref: "#/components/schemas/Page"}
        - type: object
          properties:
            data: {type: array, items: {$ref: "#/components/schemas/DayClose"}}
    DayCloseToday:
      type: object
      required: [day, closing_time, closed, close, expected_cash, by_method, count, per_member, non_cash, watch, can_close, can_reopen]
      properties:
        day: {type: string, format: date, description: Today, on the workspace's own clock.}
        closing_time: {type: string, example: "20:00", description: When the team is asked to close the day, by the workspace's own clock.}
        closed: {type: boolean, description: True while a close of today stands.}
        close: {oneOf: [{$ref: "#/components/schemas/DayClose"}, {type: "null"}], description: Today's latest close (a reopened one included), or null.}
        expected_cash: {$ref: "#/components/schemas/Money", description: "Cash recorded today, less cash given back by voids; negative on a day that only gave money back."}
        by_method: {type: object, additionalProperties: {$ref: "#/components/schemas/Money"}}
        count: {type: integer}
        per_member:
          type: object
          additionalProperties:
            type: object
            properties:
              name: {type: string}
              cash: {$ref: "#/components/schemas/Money"}
              count: {type: integer}
        non_cash:
          type: array
          description: Every card, transfer, cheque and other line of the day, oldest first; a void is its own negative line.
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              customer: {type: string}
              amount: {$ref: "#/components/schemas/Money"}
              method: {type: string}
              note: {type: [string, "null"]}
        watch:
          type: array
          description: >-
            What is worth a look today. When more than ten contracts were opened in the day (an import), they are one
            `opened` line: its `label` says how many ("300 contracts opened"), its `id` is the first of them and its
            `amount` the sum of their prices.
          items:
            type: object
            properties:
              kind: {type: string, enum: [void, waived_fee, back_dated, opened, cancelled]}
              id: {type: string, format: uuid}
              label: {type: string, description: "The customer's name, or how many contracts were opened for a line that stands for many."}
              amount: {type: [string, "null"], description: "What it concerned, always positive; null for an open account, which has no price."}
        can_close: {type: boolean}
        can_reopen: {type: boolean}
    Token:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        created_at: {type: string, format: date-time}
        last_used_at: {type: [string, "null"], format: date-time}
        expires_at: {type: [string, "null"], format: date-time}
    Page:
      type: object
      properties:
        links:
          type: object
          properties:
            first: {type: [string, "null"]}
            last: {type: [string, "null"]}
            prev: {type: [string, "null"]}
            next: {type: [string, "null"]}
        meta:
          type: object
          properties:
            current_page: {type: integer}
            last_page: {type: integer}
            per_page: {type: integer}
            total: {type: integer}
