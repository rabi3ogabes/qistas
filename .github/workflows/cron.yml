name: Scheduler

# The site has no scheduler and no queue worker of its own, so this workflow is what runs scheduled work: every five
# minutes it calls the site's cron endpoint once. It does nothing until two repository secrets exist
# (Settings > Secrets and variables > Actions):
#   CRON_URL     the full address of the endpoint, for example https://your-site.example/internal/cron
#   CRON_SECRET  the same value as the CRON_SECRET setting of the site
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduler
  cancel-in-progress: false

jobs:
  tick:
    name: Call the cron endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CRON_URL: ${{ secrets.CRON_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Run one tick
        run: |
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::Scheduler is not set up. Add the CRON_URL and CRON_SECRET repository secrets to switch it on."
            exit 0
          fi

          status=$(curl --silent --show-error --max-time 60 --output response.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $CRON_SECRET" "$CRON_URL") || {
            echo "::error::The cron endpoint could not be reached."
            exit 1
          }

          case "$status" in
            200) cat response.json; echo ;;
            409) echo "::notice::Another tick was still running, so this one did nothing." ;;
            *) echo "::error::The cron endpoint answered $status."; cat response.json; echo; exit 1 ;;
          esac
