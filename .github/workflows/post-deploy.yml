name: Post-deploy smoke test

# Vercel reports each finished deployment to GitHub; verify production right after it goes live.
on:
  deployment_status

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test production
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://qistas-puce.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
      - name: Public pages answer, guests are kept out of /app, assets load
        run: sh scripts/smoke-app.sh "$PRODUCTION_URL" 120
