name: Mobile app

# The Flutter app in app/: analysis, tests, translation completeness, a web build, and an Android APK that is
# attached to the rolling "Qistas app (latest)" release so it can be downloaded straight from GitHub.

on:
  push:
    branches: [main]
    paths: ["app/**", "shared/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", "shared/**", ".github/workflows/app.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

env:
  FLUTTER_VERSION: "3.41.2"

jobs:
  check:
    name: Analyse and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Zero issues, including infos: the build fails on any analyzer message.
      - run: flutter analyze
      # Every sentence the app shows has all four translations, with its placeholders intact.
      - run: python3 tool/i18n.py --sync
      - run: flutter test

  web:
    name: Web build
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build the web app
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          flutter build web --release --dart-define=APP_VERSION="$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: qistas-app-web
          path: app/build/web
          retention-days: 30

  android:
    name: Android build
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # to tag the version, publish its release and attach the APK
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release notes list the app's changes since the previous version's tag
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build the APK
        id: build
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          flutter build apk --release --build-name="$VERSION" --build-number="${{ github.run_number }}" --dart-define=APP_VERSION="$VERSION"
          cp build/app/outputs/flutter-apk/app-release.apk ../qistas-app.apk
          cp build/app/outputs/flutter-apk/app-release.apk "../qistas-app-$VERSION.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: qistas-app-android
          path: qistas-app-${{ steps.build.outputs.version }}.apk
          retention-days: 30
      # Only builds of main are published; a pull request just proves that it builds.
      # Every version of the app (app/pubspec.yaml) gets a release of its own, tagged app-v<version>, with its APK and
      # what changed since the previous version. Building the same version again refreshes that version's release.
      - name: Write the release notes
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          PREVIOUS=$(git tag --list 'app-v*' --sort=-v:refname | grep -vx "app-v$VERSION" | head -n 1)
          RANGE="$GITHUB_SHA"
          if [ -n "$PREVIOUS" ]; then RANGE="$PREVIOUS..$GITHUB_SHA"; fi
          {
            echo "**Qistas app $VERSION** for Android (build ${{ github.run_number }})."
            echo
            echo "**Install:** download \`qistas-app-$VERSION.apk\` on the phone, open it and allow installation from this source when asked."
            echo "This is a test build signed with a debug key: if you already have an older one, uninstall it first."
            echo "It talks to https://qistas-puce.vercel.app, so you sign in with the same account as on the website."
            echo
            if [ -n "$PREVIOUS" ]; then echo "### What changed since ${PREVIOUS#app-v}"; else echo "### What is in this version"; fi
            git log --no-merges --pretty='- %s' "$RANGE" -- app/ | head -n 40
            echo
            echo "Commit: $GITHUB_SHA"
          } > release-notes.md
          cat release-notes.md
      - name: Tag this version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          git tag -f "app-v$VERSION" "$GITHUB_SHA"
          git push -f origin "app-v$VERSION"
          git tag -f app-latest "$GITHUB_SHA"
          git push -f origin app-latest
      - name: Publish the version's own release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ steps.build.outputs.version }}
          name: Qistas app ${{ steps.build.outputs.version }}
          make_latest: "true"
          fail_on_unmatched_files: true
          files: qistas-app-${{ steps.build.outputs.version }}.apk
          body_path: release-notes.md
      # The address https://github.com/rabi3ogabes/qistas/releases/download/app-latest/qistas-app.apk keeps working and
      # always gives the newest build; the version's own release above is the one marked "Latest".
      - name: Keep the newest-build link working
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Qistas app (newest build)
          make_latest: "false"
          fail_on_unmatched_files: true
          files: qistas-app.apk
          body: |
            Always the newest Android build of the Qistas app (now ${{ steps.build.outputs.version }}), at a link that never changes.
            Each version also has a release of its own, with what changed: see the releases tagged `app-v…`.

            Commit: ${{ github.sha }}
