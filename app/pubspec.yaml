name: qistas
description: "Qistas: customers, contracts and payments for instalment businesses"
publish_to: 'none'

# build-name+build-number. CI overrides the build number with the run number.
version: 1.6.0+8

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  intl: any
  url_launcher: ^6.3.3
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/i18n/
    - assets/icon/

  # Bundled so the app looks the same offline: tool/fonts.py builds these from the website's font packages.
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/CormorantGaramond-Bold.ttf
          weight: 700
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoNastaliqUrdu-SemiBold.ttf
          weight: 600

# `python tool/icons.py` draws the layers, then `dart run flutter_launcher_icons` writes the Android, iOS and web icons:
# on Android an adaptive icon (navy background, the mark in front) with a single-colour layer for themed icons.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#0B1F44"
  adaptive_icon_foreground: assets/icon/foreground.png
  adaptive_icon_monochrome: assets/icon/monochrome.png
  # The layers already keep the mark inside the launcher's safe zone (tool/icons.py), so no extra inset.
  adaptive_icon_foreground_inset: 0
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: '#F7F3EA'
    theme_color: '#0B1F44'
