name: qistas
description: "Qistas: customers, contracts and payments for instalment businesses"
publish_to: 'none'

# build-name+build-number. CI overrides the build number with the run number.
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  intl: any
  google_fonts: ^8.2.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/i18n/
    - assets/icon/

# `dart run flutter_launcher_icons` writes the Android, iOS, web and Windows icons from the Qistas mark.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: '#F7F3EA'
    theme_color: '#0B1F44'
